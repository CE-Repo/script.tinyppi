# Development tooling only -- Kodi reads addon.xml, not this file.

[tool.ruff]
target-version = "py311"

[tool.ruff.lint]
# Errors and likely bugs, not style: pyflakes, syntax errors, bugbear and
# pylint's error class.
select = ["F", "E9", "B", "PLE"]
ignore = [
    # zip() without strict=: every zip here pairs sequences that are the same
    # length by construction, or wants the shorter one on purpose.
    "B905",
]

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark light">
<meta name="theme-color" content="#0b0d10">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="robots" content="noindex, nofollow">
<title>TinyPPI — Dolby Vision metadata</title>
<link rel="apple-touch-icon" href="/icon.jpg">
<link rel="icon" href="/icon.jpg">
<link rel="stylesheet" href="/style.css">
<style>
/* ---------------------------------------------------------------------------
   The Dolby Vision metadata window.

   A window of its own rather than a section of the dashboard: the list runs to
   a hundred readings and more, and on a second screen it is worth the whole
   screen.  Nothing here is picked out or interpreted -- the rows arrive as
   info.dvmetadata builds them for the on-screen view, so what is listed is
   what the bitstream said.
--------------------------------------------------------------------------- */

/* The row count, in the footer's small print: how many readings this list is
   holding, which is the one thing the panels above do not say. */
.count { color: var(--dim); font-size: 12.5px; }

.metarows { padding: 6px 0 14px; }

/* One column on a phone, more as the window widens: the sections stand alone,
   so they read fine side by side and the page stops being a mile long. */
@media (min-width: 900px)  { .metarows { columns: 2; column-gap: 28px; padding: 10px 8px 16px; } }
@media (min-width: 1500px) { .metarows { columns: 3; } }
.mblock { break-inside: avoid; }

.msection {
  margin: 14px 16px 6px;
  padding-bottom: 5px;
  border-bottom: 1px solid var(--line);
  font-size: 12px;
  font-weight: 700;
  letter-spacing: .1em;
  text-transform: uppercase;
  color: var(--accent);
  display: flex;
  gap: 8px;
  align-items: baseline;
}
.msection .state {
  margin-left: auto;
  font-size: 10px;
  font-weight: 600;
  letter-spacing: .06em;
  color: var(--dim);
  text-transform: none;
}

.mrow {
  display: grid;
  grid-template-columns: minmax(110px, 45%) 1fr;
  gap: 10px;
  padding: 3px 16px;
  font-size: 12.5px;
}
.mrow .k { color: var(--muted); overflow-wrap: anywhere; }
.mrow .v { text-align: right; overflow-wrap: anywhere; transition: color .45s ease-out; }
.mrow.changed .v { color: var(--accent-2); transition: none; }

.mwide {
  padding: 3px 16px;
  font-size: 12.5px;
  overflow-wrap: anywhere;
}

/* A trim pass only means anything read against its neighbours, so its cells go
   in fixed slots rather than wrapping into each other -- and the whole table
   is one grid, so a reading always sits under the heading that names it.

   Turned on its side against the on-screen view: there a pass is a row, which
   fits because a row there is 1195 px wide, but a column of this page is a
   fifth of that and the six-to-eight controls ran off the edge.  The controls
   go down the left instead and each pass takes a column, which is the shape a
   narrow column holds -- there are only ever a handful of passes, one per
   target display. */
.mtable { padding: 2px 16px 8px; overflow-x: auto; }
.mgrid {
  /* The track list is set on the element -- a count inside repeat() cannot be
     a variable everywhere this page is opened -- from these two widths. */
  --lead: 88px;
  --cell: 54px;
  display: grid;
  grid-template-columns: minmax(var(--lead), auto) minmax(var(--cell), 1fr);
  gap: 3px 12px;
  min-width: max-content;
  font-size: 12.5px;
}
.mgrid > span {
  text-align: right;
  overflow-wrap: anywhere;
  transition: color .45s ease-out;
}
.mgrid > span.changed { color: var(--accent-2); transition: none; }
.mgrid .lead, .mgrid .corner { text-align: left; }
.mgrid .lead { color: var(--muted); }
.mgrid .corner, .mgrid .head {
  color: var(--dim);
  font-size: 10.5px;
  line-height: 1.6;
  text-transform: uppercase;
  letter-spacing: .06em;
}
/* The rule under the headings is a cell of its own across the whole grid: a
   border on each heading would break at every gap between the columns. */
.mgrid .rule {
  grid-column: 1 / -1;
  height: 1px;
  margin-bottom: 3px;
  background: var(--line-soft);
}

.empty {
  padding: 48px 24px;
  text-align: center;
  display: grid;
  gap: 8px;
  justify-items: center;
}
.empty .big { font-size: 17px; font-weight: 600; }
.empty p { margin: 0; color: var(--muted); font-size: 13.5px; max-width: 46ch; }
</style>
</head>

<body>

<header class="topbar">
  <div class="brand">
    <b>TinyPPI</b><span class="ver" id="version"></span>
  </div>
  <div class="status" id="status" data-state="wait" role="status" aria-live="polite">
    <span class="dot"></span><span id="statusText">…</span>
  </div>
  <button class="iconbtn" id="tokenBtn" type="button" title="Token">🔑</button>
</header>

<main>
  <div id="live"></div>

  <section class="card" id="listCard">
    <div class="metarows" id="metaRows"></div>
  </section>

  <section class="card hidden" id="idleCard">
    <div class="empty">
      <div class="big" id="idleTitle">—</div>
      <p id="idleText"></p>
    </div>
  </section>

  <footer>
    <span id="foot"></span>
    <span class="count mono" id="count"></span>
    <button class="ghost" id="copyBtn" type="button"></button>
  </footer>
</main>

<script src="/stream.js"></script>
<script>
"use strict";

/* ===========================================================================
   The Dolby Vision metadata window.

   Fed by the same stream the dashboard sits on: the rows arrive as
   (kind, name, value) exactly as info.dvmetadata builds them for the
   on-screen view, and this page only lays them out.
=========================================================================== */

const $ = TinyPPI.$;
const T = TinyPPI.T;

const el = {
  version: $("version"), count: $("count"),
  listCard: $("listCard"), idleCard: $("idleCard"), metaRows: $("metaRows"),
  foot: $("foot"), copyBtn: $("copyBtn")
};

let state = null;
let signature = "";   /* the list's shape, so nodes are rebuilt only when it moves */
let live = [];        /* {node, index, field} for every reading that changes      */

/* --- render ------------------------------------------------------------- */

function render(next) {
  state = next;
  const rows = next.metadata || [];

  document.title = next.title
    ? next.title + " — " + T.metadata
    : "TinyPPI — " + T.metadata;
  /* What is playing, the four figures and the last minute of luminance: the
     same three the dashboard opens on, from the same snapshot, so a screen
     left on this page still says what the film is doing. */
  TinyPPI.panels.update(next);

  if (!rows.length) {
    el.listCard.classList.add("hidden");
    el.idleCard.classList.remove("hidden");
    /* Two different nothings: no film at all, or a film with no RPU behind it.
       Saying which is the difference between a window that looks broken and
       one that has answered. */
    $("idleTitle").textContent = next.playing ? T.no_metadata : T.idle_title;
    $("idleText").textContent  = next.playing ? T.no_metadata_text : T.idle_text;
    el.count.textContent = "";
    signature = "";
    live = [];
    el.metaRows.textContent = "";
    return;
  }

  el.listCard.classList.remove("hidden");
  el.idleCard.classList.add("hidden");
  el.count.textContent = rows.filter((row) => row.kind !== "space").length;

  /* Rebuilding a hundred-odd nodes five times a second would fight the browser
     for no gain, and the list only changes shape when a block comes or goes.
     So the values are written in place and the nodes are rebuilt only when the
     shape itself moves. */
  const shape = rows
    .map((row) => row.kind + "\u001f" + row.name +
                  "\u001f" + (row.cells ? row.cells.length : ""))
    .join("\u001e");
  if (shape !== signature) {
    signature = shape;
    build(rows);
    return;
  }
  update(rows);
}

function build(rows) {
  const frag = document.createDocumentFragment();
  el.metaRows.textContent = "";
  live = [];

  /* Each section and its rows go in a block of their own, so a multi-column
     layout breaks between sections and never through one. */
  let block = null;
  const open = () => {
    block = document.createElement("div");
    block.className = "mblock";
    frag.append(block);
  };

  for (let index = 0; index < rows.length; index++) {
    const row = rows[index];
    if (row.kind === "space") continue;        /* the blocks space themselves */
    if (row.kind === "section" || !block) open();

    /* A trim table is several rows read as one thing, and it is turned on its
       side to fit a column, so it is taken whole. */
    if (row.kind === "headings") {
      index = table(block, rows, index);
      continue;
    }
    if (row.kind === "columns") continue;   /* taken by its own heading row */

    let node;
    if (row.kind === "section") {
      node = document.createElement("div");
      node.className = "msection";
      const name = document.createElement("span");
      name.textContent = row.name;
      const held = document.createElement("span");
      held.className = "state";
      /* A held block says so on its heading -- see info.dvmetadata._state. */
      held.textContent = row.value || "";
      node.append(name, held);
      live.push({ node: held, index, field: "value" });
    } else if (row.kind === "wide") {
      node = document.createElement("div");
      node.className = "mwide mono";
      node.textContent = row.value;
      live.push({ node, index, field: "value" });
    } else {
      node = document.createElement("div");
      node.className = "mrow";
      const key = document.createElement("span");
      key.className = "k";
      key.textContent = row.name;
      const value = document.createElement("span");
      value.className = "v mono";
      value.textContent = row.value;
      node.append(key, value);
      live.push({ node: value, index, field: "value", row: node, last: row.value });
    }
    block.append(node);
  }

  el.metaRows.append(frag);
}


/* --- trim tables --------------------------------------------------------- */

/* One trim table, from the heading row at *start* and the pass rows under it,
   appended to *block*.  Returns the index of the last row it took.

   The list arrives laid out for the television: a heading row naming the
   controls, then a row per pass.  Here it is turned on its side -- controls
   down the left, a column per pass -- because a row of the on-screen list is
   1195 px wide and a column of this page is a fifth of that, which is not
   enough for six to eight controls abreast.  Passes are few, one per target
   display, so the tall shape is the one that fits.

   More controls than the on-screen row holds arrive as a second table with
   the heading repeated -- a limit belonging to that row, not to this page --
   so a continuation is read back into the table it was cut from. */
function table(block, rows, start) {
  const legend   = rows[start].name;
  const passes   = [];      /* one per target display, across the top */
  const controls = [];      /* one per control, down the left side    */
  let last = start;

  for (let index = start; index < rows.length; ) {
    /* The pass rows belonging to this heading row. */
    const chunk = [];
    let scan = index + 1;
    while (scan < rows.length && rows[scan].kind === "columns") {
      chunk.push(scan);
      scan++;
    }
    if (!chunk.length) break;

    if (!passes.length) for (const source of chunk) passes.push(rows[source].name);
    (rows[index].cells || []).forEach((name, cell) => {
      controls.push({ name, cells: chunk.map((source) => ({ source, cell })) });
    });
    last = scan - 1;

    /* A continuation is the same legend over the same passes; anything else
       is a table of its own, and the caller walks into it. */
    let next = scan;
    while (next < rows.length && rows[next].kind === "space") next++;
    if (next >= rows.length || rows[next].kind !== "headings" ||
        rows[next].name !== legend) break;
    const after = rows.slice(next + 1, next + 1 + chunk.length);
    if (after.length !== chunk.length ||
        after.some((row, at) => row.kind !== "columns" ||
                                row.name !== rows[chunk[at]].name)) break;
    index = next;
  }

  if (!controls.length) return last;

  const wrap = document.createElement("div");
  wrap.className = "mtable";
  const grid = document.createElement("div");
  grid.className = "mgrid";
  grid.style.gridTemplateColumns =
    "minmax(var(--lead), auto) repeat(" + passes.length +
    ", minmax(var(--cell), 1fr))";

  const corner = document.createElement("span");
  corner.className = "corner";
  corner.textContent = legend;
  grid.append(corner);
  for (const name of passes) {
    const head = document.createElement("span");
    head.className = "head";
    head.textContent = name;
    grid.append(head);
  }
  const rule = document.createElement("span");
  rule.className = "rule";
  grid.append(rule);

  for (const control of controls) {
    const lead = document.createElement("span");
    lead.className = "lead";
    lead.textContent = control.name;
    grid.append(lead);
    for (const cell of control.cells) {
      const node = document.createElement("span");
      node.className = "mono";
      node.textContent = (rows[cell.source].cells || [])[cell.cell] || "";
      grid.append(node);
      live.push({ node, index: cell.source, field: "cell", cell: cell.cell });
    }
  }

  wrap.append(grid);
  block.append(wrap);
  return last;
}

function update(rows) {
  for (const entry of live) {
    const row = rows[entry.index];
    if (!row) continue;
    if (entry.field === "cell") {
      const cell = (row.cells || [])[entry.cell] || "";
      if (entry.node.textContent === cell) continue;
      entry.node.textContent = cell;
      /* A trim is the fastest-moving reading the view has, and on screen it
         is highlighted like any other; the cell itself lights up, since a
         whole table row of them lit at once would say less than the one
         control that actually moved. */
      flash(entry);
      continue;
    }
    const text = row.value || "";
    if (entry.node.textContent === text) continue;
    entry.node.textContent = text;
    /* Mirrors the overlay's own highlight: a reading that moved is written in
       the change color and fades back. */
    if (entry.row) flash(entry);
  }
}

function flash(entry) {
  /* A name and its value are lit as a pair -- the row carries the class -- and
     a trim cell on its own. */
  const node = entry.row || entry.node;
  node.classList.add("changed");
  clearTimeout(entry.timer);
  entry.timer = setTimeout(() => node.classList.remove("changed"), 750);
}

/* --- report ------------------------------------------------------------- */

function buildReport() {
  if (!state || !(state.metadata || []).length) return "";
  const lines = ["TinyPPI — " + T.metadata];
  if (state.title) lines.push(state.title);
  if (state.filename) lines.push(state.filename);
  lines.push("");
  for (const row of state.metadata) {
    if (row.kind === "space") lines.push("");
    else if (row.kind === "section")
      lines.push("[" + row.name + (row.value ? " - " + row.value : "") + "]");
    else if (row.kind === "wide") lines.push("  " + row.value);
    else if (row.cells) lines.push("  " + row.name.padEnd(26) + row.cells.join("  "));
    else lines.push("  " + row.name.padEnd(26) + row.value);
  }
  return lines.join("\n");
}

el.copyBtn.addEventListener("click", async () => {
  const report = buildReport();
  if (!report) return;
  try {
    await navigator.clipboard.writeText(report);
    TinyPPI.toast(T.copied);
  } catch (_) {
    /* Clipboard access needs a secure context, which plain http on a LAN is
       not; hand the report over as a file instead of failing silently. */
    const url = URL.createObjectURL(new Blob([report], { type: "text/plain" }));
    const link = document.createElement("a");
    link.href = url;
    link.download = "tinyppi-metadata.txt";
    link.click();
    URL.revokeObjectURL(url);
  }
});

/* --- boot --------------------------------------------------------------- */

function applyStrings(strings, hello) {
  TinyPPI.panels.strings(strings);
  el.copyBtn.textContent = strings.copy;
  if (hello) {
    el.version.textContent = "v" + hello.version;
    el.foot.textContent = "TinyPPI " + hello.version;
  }
  document.title = "TinyPPI — " + strings.metadata;
}

TinyPPI.boot({ onState: render, onStrings: applyStrings });
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark light">
<meta name="theme-color" content="#0b0d10">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="robots" content="noindex, nofollow">
<title>TinyPPI — Dolby Vision metadata</title>
<link rel="apple-touch-icon" href="/icon.jpg">
<link rel="icon" href="/icon.jpg">
<link rel="stylesheet" href="/css/base.css">
<link rel="stylesheet" href="/css/live-panels.css">
<link rel="stylesheet" href="/css/metadata.css">
</head>

<body>

<header class="topbar">
  <div class="brand">
    <b>TinyPPI</b><span class="ver" id="version"></span>
  </div>
  <div class="status" id="status" data-state="wait" role="status" aria-live="polite">
    <span class="dot"></span><span id="statusText">…</span>
  </div>
  <button class="iconbtn hidden" id="copyBtn" type="button">
    <img class="ui-icon" src="/icons/download.svg" alt="">
  </button>
  <button class="iconbtn" id="tokenBtn" type="button" title="Token" aria-label="Token">
    <img class="ui-icon" src="/icons/key.svg" alt="">
  </button>
</header>

<main>
  <div id="live"></div>

  <section class="card" id="listCard">
    <div class="metarows" id="metaRows"></div>
  </section>

  <section class="card hidden" id="idleCard">
    <div class="empty">
      <div class="big" id="idleTitle">—</div>
      <p id="idleText"></p>
    </div>
  </section>

  <footer>
    <span class="count mono" id="count"></span>
  </footer>
</main>

<script src="/js/core.js"></script>
<script src="/js/live-panels.js"></script>
<script src="/js/metadata.js"></script>
</body>
</html>

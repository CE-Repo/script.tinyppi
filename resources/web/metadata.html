<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#090b0f">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="robots" content="noindex, nofollow">
<!-- Loaded here, ahead of everything it could flash against: it puts
     the chosen theme on <html> before the page is first painted. -->
<script src="/js/theme.js"></script>
<title>TinyPPI — Dolby Vision metadata</title>
<link rel="apple-touch-icon" href="/icon.jpg">
<link rel="icon" href="/icon.jpg">
<link rel="stylesheet" href="/css/base.css">
<link rel="stylesheet" href="/css/live-panels.css">
<link rel="stylesheet" href="/css/metadata.css">
<link rel="stylesheet" href="/css/theme.css">
</head>

<body class="metadata-page">

<header class="topbar">
  <div class="brand">
    <img class="brandmark" src="/icon.jpg" alt="">
    <b>TinyPPI</b><span class="ver" id="version"></span>
  </div>
  <div class="action-menu" id="actionMenu">
    <button class="iconbtn" id="actionMenuToggle" type="button"
            title="Menu" aria-label="Menu" aria-controls="actionMenuItems"
            aria-expanded="false">
      <span class="hamburger" aria-hidden="true"></span>
    </button>
    <div class="action-menu-items" id="actionMenuItems" aria-hidden="true" inert>
      <button class="iconbtn hidden" id="copyBtn" type="button">
        <span class="ui-icon painted" style="--icon: url('/icons/download.svg')"></span>
      </button>
      <button class="iconbtn" id="tokenBtn" type="button" title="Token" aria-label="Token">
        <span class="ui-icon painted" style="--icon: url('/icons/key.svg')"></span>
      </button>
    </div>
  </div>
  <div class="status" id="status" data-state="wait" role="status" aria-live="polite">
    <span class="dot"></span><span id="statusText">…</span>
  </div>
</header>

<main>
  <div id="live"></div>

  <details class="card hidden" id="frameCard">
    <summary class="panel-toggle"><span id="frameTitle"></span></summary>
    <div class="framewrap">
      <div class="frame"><i id="frameActive"></i></div>
      <div class="framenote mono" id="frameNote"></div>
    </div>
  </details>

  <details class="card" id="listCard">
    <summary class="panel-toggle"><span id="metadataTitle"></span></summary>
    <div class="metarows" id="metaRows"></div>
  </details>

  <!-- Centred in the viewport when it is the only thing on the page; the
       dashboard's own idle column is built the same way (see .idlestack). -->
  <div class="idlestack">
    <section class="card hidden" id="idleCard">
      <div class="empty">
        <div class="big" id="idleTitle">—</div>
        <p id="idleText"></p>
      </div>
    </section>
  </div>
</main>

<script src="/js/core.js"></script>
<script src="/js/cover-tint.js"></script>
<script src="/js/live-panels.js"></script>
<script src="/js/metadata.js"></script>
</body>
</html>

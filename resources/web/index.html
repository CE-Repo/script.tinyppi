<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#090b0f">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="robots" content="noindex, nofollow">
<!-- Loaded here, ahead of everything it could flash against: it puts
     the chosen theme on <html> before the page is first painted. -->
<script src="/js/theme.js"></script>
<title>TinyPPI</title>
<link rel="manifest" href="/manifest.webmanifest">
<link rel="apple-touch-icon" href="/icon.png">
<link rel="icon" href="/icon.png">
<link rel="stylesheet" href="/css/base.css">
<link rel="stylesheet" href="/css/live-panels.css">
<link rel="stylesheet" href="/css/dashboard.css">
<link rel="stylesheet" href="/css/metadata.css">
<link rel="stylesheet" href="/css/theme.css">
</head>

<body class="dashboard-page">

<header class="topbar">
  <div class="brand">
    <img class="brandmark" src="/icon.png" alt="">
    <b>TinyPPI</b><span class="ver" id="version"></span>
  </div>
  <div class="status" id="status" data-state="wait" role="status" aria-live="polite">
    <span class="dot"></span><span id="statusText">…</span>
  </div>
</header>

<main>

  <!-- One page in six tabs: the five the TinyPPI app puts in its floating
       bar -- what is playing, the Dolby Vision metadata, the two shelves and
       the history -- and the settings.  Each tab is a panel of its own and only the chosen one is
       laid out (see the tabs in js/dashboard.js); the connection underneath
       is the one stream whichever of them is in front. -->

  <!-- What is playing, what can be done to it, and every reading the overlay
       carries. -->
  <section class="tabpanel" id="tab-live" data-tab="live" role="tabpanel"
           aria-labelledby="tabbtn-live">
    <div class="rail rail-main">
      <div id="live"></div>

      <details class="card hidden" id="vs10Card">
        <summary class="panel-toggle"><span id="vs10Title"></span></summary>
        <div class="vs10">
          <div class="out"><span id="vs10OutLabel"></span><b id="vs10Out">N/A</b></div>
          <div class="modes" id="modes"></div>
        </div>
      </details>
    </div>

    <!-- Every reading the overlay carries, as many cards to a row as fit. -->
    <div class="groups" id="groups"></div>

    <section class="card idlecard hidden" id="idleCard">
      <div class="empty">
        <div class="big" id="idleTitle">—</div>
        <p id="idleText"></p>
      </div>
    </section>
  </section>

  <!-- The Dolby Vision metadata: the active picture, the L1 luminance chart
       (moved in here from #live by js/dashboard.js) and the whole list. -->
  <section class="tabpanel" id="tab-metadata" data-tab="metadata" role="tabpanel"
           aria-labelledby="tabbtn-metadata">
    <details class="card hidden" id="frameCard">
      <summary class="panel-toggle"><span id="frameTitle"></span></summary>
      <div class="framewrap">
        <div class="frame"><i id="frameActive"></i></div>
        <div class="framenote mono" id="frameNote"></div>
      </div>
    </details>

    <details class="card hidden" id="listCard">
      <summary class="panel-toggle"><span id="metadataTitle"></span></summary>
      <div class="metarows" id="metaRows"></div>
    </details>

    <section class="card idlecard hidden" id="metaIdleCard">
      <div class="empty">
        <div class="big" id="metaIdleTitle">—</div>
        <p id="metaIdleText"></p>
      </div>
    </section>
  </section>

  <!-- The films the video database holds: what was left half-watched, what
       arrived last, what has not been seen yet, and the wall of all of them.  A press on a
       poster asks what is wanted of it (see "what a press asks" in
       js/marking.js). -->
  <section class="tabpanel" id="tab-films" data-tab="films" role="tabpanel"
           aria-labelledby="tabbtn-films">
    <!-- The search at the top of the tab and the order and the filters on a
         card under it, as the app has them; they narrow the wall below. -->
    <div class="shelfhead shelftop hidden" id="filmsHead">
      <div class="searchbox" id="filmSearchBox">
        <input class="filmsearch" id="filmSearch" type="search" autocomplete="off"
               spellcheck="false" aria-labelledby="filmsLabel">
        <button class="searchclear hidden" id="filmSearchClear" type="button"></button>
      </div>
      <div class="shelftools" id="filmTools"></div>
    </div>

    <details class="card hidden" id="continueFilmsCard">
      <summary class="panel-toggle">
        <span id="continueFilmsLabel"></span>
        <span class="filmscount mono" id="continueFilmsCount"></span>
      </summary>
      <div class="filmsbody">
        <div class="continuerow" id="continueFilmsRow"></div>
      </div>
    </details>

    <details class="card hidden" id="recentFilmsCard">
      <summary class="panel-toggle">
        <span id="recentFilmsLabel"></span>
      </summary>
      <div class="filmsbody">
        <div class="continuerow" id="recentFilmsRow"></div>
      </div>
    </details>

    <details class="card hidden" id="unseenFilmsCard">
      <summary class="panel-toggle">
        <span id="unseenFilmsLabel"></span>
        <span class="filmscount mono" id="unseenFilmsCount"></span>
      </summary>
      <div class="filmsbody">
        <div class="continuerow" id="unseenFilmGrid"></div>
      </div>
    </details>

    <details class="card hidden" id="filmsCard">
      <summary class="panel-toggle">
        <span id="filmsLabel"></span>
        <span class="filmscount mono" id="filmsCount"></span>
      </summary>
      <div class="filmsbody">
        <div class="filmgrid" id="filmGrid"></div>
        <p class="filmsempty hidden" id="filmsEmpty"></p>
      </div>
    </details>
  </section>

  <!-- And the series: the same four cards, except that a series is not a
       thing that can be played -- a press opens the show, its seasons open in
       a dialog of their own (#seasonsDialog), and a press on an episode there
       starts it. -->
  <section class="tabpanel" id="tab-series" data-tab="series" role="tabpanel"
           aria-labelledby="tabbtn-series">
    <div class="shelfhead shelftop hidden" id="seriesSearchBox">
      <div class="searchbox">
        <input class="filmsearch" id="seriesSearch" type="search" autocomplete="off"
               spellcheck="false" aria-labelledby="seriesLabel">
        <button class="searchclear hidden" id="seriesSearchClear" type="button"></button>
      </div>
      <div class="shelftools" id="seriesTools"></div>
    </div>

    <details class="card hidden" id="continueSeriesCard">
      <summary class="panel-toggle">
        <span id="continueSeriesLabel"></span>
        <span class="filmscount mono" id="continueSeriesCount"></span>
      </summary>
      <div class="filmsbody">
        <div class="continuerow" id="continueSeriesRow"></div>
      </div>
    </details>

    <details class="card hidden" id="nextSeriesCard">
      <summary class="panel-toggle">
        <span id="nextSeriesLabel"></span>
        <span class="filmscount mono" id="nextSeriesCount"></span>
      </summary>
      <div class="filmsbody">
        <div class="continuerow" id="nextSeriesRow"></div>
      </div>
    </details>

    <details class="card hidden" id="recentSeriesCard">
      <summary class="panel-toggle">
        <span id="recentSeriesLabel"></span>
      </summary>
      <div class="filmsbody">
        <div class="continuerow" id="recentSeriesRow"></div>
      </div>
    </details>

    <details class="card hidden" id="unseenSeriesCard">
      <summary class="panel-toggle">
        <span id="unseenSeriesLabel"></span>
        <span class="filmscount mono" id="unseenSeriesCount"></span>
      </summary>
      <div class="filmsbody">
        <div class="continuerow" id="unseenSeriesGrid"></div>
      </div>
    </details>

    <details class="card hidden" id="seriesCard">
      <summary class="panel-toggle">
        <span id="seriesLabel"></span>
        <span class="filmscount mono" id="seriesCount"></span>
      </summary>
      <div class="filmsbody">
        <div class="filmgrid" id="seriesGrid"></div>
        <p class="filmsempty hidden" id="seriesEmpty"></p>
      </div>
    </details>
  </section>

  <!-- What the playing of it has come to: the figures and the events along
       the way (the events card is moved in here from #live), and -- once it
       has ended -- what the title that just finished added up to. -->
  <section class="tabpanel" id="tab-history" data-tab="history" role="tabpanel"
           aria-labelledby="tabbtn-history">
    <!-- The add-on keeps a session for a while after the player stops, which
         is when its figures are worth reading (see SessionLog.end in
         web/session.py). -->
    <section class="card hidden" id="lastCard">
      <div class="lasthead">
        <span class="k" id="lastLabel"></span>
        <b id="lastTitle"></b>
      </div>
      <div class="tilegrid" id="lastTiles"></div>
    </section>

    <section class="card idlecard hidden" id="historyIdleCard">
      <div class="empty">
        <div class="big" id="historyIdleTitle">—</div>
        <p id="historyIdleText"></p>
      </div>
    </section>
  </section>

  <!-- What used to hide behind the key in the top bar: the theme, the access
       token and the reports, each a card of its own, and the progress bar's
       chapter dots (see js/theme.js, js/live-chapters.js and the settings in
       js/dashboard.js). -->
  <section class="tabpanel" id="tab-settings" data-tab="settings" role="tabpanel"
           aria-labelledby="tabbtn-settings">
    <section class="card setcard">
      <h2 class="sethead" id="themeHead"></h2>
      <div class="setbody" id="themeSettings"></div>
    </section>

    <section class="card setcard">
      <h2 class="sethead" id="tokenHead"></h2>
      <div class="setbody">
        <p class="setnote" id="tokenNote"></p>
        <div class="setrow">
          <span class="tokenshown mono" id="tokenShown">N/A</span>
          <button class="setbtn" id="tokenBtn" type="button">
            <span class="ui-icon painted icon-key"></span>
            <span id="tokenBtnText"></span>
          </button>
        </div>
      </div>
    </section>

    <!-- The chapter dots on the progress bar, this device's own choice (see
         js/live-chapters.js). -->
    <section class="card setcard">
      <h2 class="sethead" id="barHead"></h2>
      <div class="setbody">
        <label class="setswitch">
          <span id="chapterMarksText"></span>
          <input type="checkbox" id="chapterMarks" role="switch" checked>
        </label>
      </div>
    </section>

    <section class="card setcard">
      <h2 class="sethead" id="reportHead"></h2>
      <div class="setbody setbtns">
        <button class="setbtn" id="copyBtn" type="button" disabled>
          <span class="ui-icon painted icon-download"></span>
          <span id="copyBtnText"></span>
        </button>
        <button class="setbtn" id="copyMetaBtn" type="button" disabled>
          <span class="ui-icon painted icon-download"></span>
          <span id="copyMetaBtnText"></span>
        </button>
      </div>
    </section>
  </section>

</main>

<!-- The floating bar the tabs are switched with: the five places of the
     app's bar, in its order, and the settings.  Icons only; each key says
     what it is to a screen reader and under a pointer (see applyStrings in
     js/start.js).  Over the page rather than under it: the panels
     leave room at their foot for it (see .tabbar in css/base.css). -->
<nav class="tabbar" id="tabBar" role="tablist" aria-label="TinyPPI">
  <button class="tab" id="tabbtn-live" type="button" role="tab" data-tab="live"
          aria-controls="tab-live">
    <span class="tabicon"><span class="ui-icon painted icon-tab-live"></span></span>
  </button>
  <button class="tab" id="tabbtn-metadata" type="button" role="tab" data-tab="metadata"
          aria-controls="tab-metadata">
    <span class="tabicon"><span class="ui-icon painted icon-tab-metadata"></span></span>
  </button>
  <button class="tab" id="tabbtn-films" type="button" role="tab" data-tab="films"
          aria-controls="tab-films">
    <span class="tabicon"><span class="ui-icon painted icon-tab-films"></span></span>
  </button>
  <button class="tab" id="tabbtn-series" type="button" role="tab" data-tab="series"
          aria-controls="tab-series">
    <span class="tabicon"><span class="ui-icon painted icon-tab-series"></span></span>
  </button>
  <button class="tab" id="tabbtn-history" type="button" role="tab" data-tab="history"
          aria-controls="tab-history">
    <span class="tabicon"><span class="ui-icon painted icon-tab-history"></span></span>
  </button>
  <button class="tab" id="tabbtn-settings" type="button" role="tab" data-tab="settings"
          aria-controls="tab-settings">
    <span class="tabicon"><span class="ui-icon painted icon-tab-settings"></span></span>
  </button>
</nav>

<!-- Library details and the actions available for this title. -->
<dialog id="detailsDialog"><form method="dialog">
  <div class="detailshero" id="detailsHero">
    <img class="detailsbackdrop" id="detailsBackdrop" alt="">
    <button class="detailsx" id="detailsX" value="close" type="submit"></button>
    <div class="detailshead">
      <img class="detailsposter" id="detailsPoster" alt="">
      <div class="detailsheading">
        <h3 id="detailsTitle"></h3>
        <p class="detailsmeta" id="detailsMeta"></p>
        <div class="detailsformats" id="detailsFormats"></div>
      </div>
    </div>
  </div>
  <div class="detailsbody">
    <div class="markoptions detailsactions" id="detailsActions">
      <button value="play" id="detailsPlay" type="submit"></button>
      <div class="detailstools">
        <button value="restart" id="detailsRestart" type="button" hidden><span class="said"></span></button>
        <button value="clear" id="detailsClear" type="button" hidden><span class="said"></span></button>
        <button value="watched" id="detailsWatched" type="button"><span class="said"></span></button>
        <button value="unwatched" id="detailsUnwatched" type="button"><span class="said"></span></button>
        <button value="show" id="detailsShow" type="button" hidden><span class="said"></span></button>
      </div>
    </div>
    <p id="detailsError" role="status" hidden></p>
    <div class="ratings" id="detailsRatings" role="list"></div>
    <p class="detailstagline" id="detailsTagline"></p>
    <p class="detailsplot" id="detailsPlot"></p>
    <dl class="facts detailsfacts" id="detailsFacts"></dl>
    <div class="castblock detailscast" id="detailsCast"></div>
  </div>
</form></dialog>

<!-- One show's seasons, each folded away with its episodes in it, opened
     from the show's details (see openShowView in js/series.js) and drawn the
     way they are: the show's backdrop, its poster and its name across the
     top, and the seasons under them.  A press on an episode opens that
     episode's details over it. -->
<dialog id="seasonsDialog"><form method="dialog">
  <div class="detailshero" id="seasonsHero">
    <img class="detailsbackdrop" id="seasonsBackdrop" alt="">
    <button class="detailsx" id="seasonsX" value="close" type="submit"></button>
    <div class="detailshead">
      <img class="detailsposter" id="seasonsPoster" alt="">
      <div class="detailsheading">
        <h3 id="seriesOpen"></h3>
        <p class="detailsmeta" id="seasonsCount"></p>
      </div>
    </div>
  </div>
  <div class="detailsbody">
    <div class="episodes" id="episodeList"></div>
  </div>
</form></dialog>

<script src="/js/core.js"></script>
<script src="/js/colour.js"></script>
<script src="/js/cover-tint.js"></script>
<script src="/js/readings.js"></script>
<script src="/js/live-chapters.js"></script>
<script src="/js/live-remote.js"></script>
<script src="/js/live-panels.js"></script>
<script src="/js/metadata.js"></script>
<script src="/js/dashboard.js"></script>
<script src="/js/shelf-tools.js"></script>
<script src="/js/films.js"></script>
<script src="/js/series.js"></script>
<script src="/js/continue.js"></script>
<script src="/js/marking.js"></script>
<script src="/js/cards.js"></script>
<script src="/js/start.js"></script>
</body>
</html>

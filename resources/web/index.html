<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark light">
<meta name="theme-color" content="#0b0d10">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="robots" content="noindex, nofollow">
<title>TinyPPI</title>
<link rel="manifest" href="/manifest.webmanifest">
<link rel="apple-touch-icon" href="/icon.jpg">
<link rel="icon" href="/icon.jpg">
<link rel="stylesheet" href="/style.css">
<style>
/* --- Active picture ----------------------------------------------------- */

.framewrap {
  padding: 14px 16px 16px;
  display: grid;
  gap: 10px;
  justify-items: center;
}
.frame {
  position: relative;
  width: 100%;
  max-width: 420px;
  aspect-ratio: 16 / 9;
  background: #05070a;
  border: 1px solid var(--line);
  border-radius: var(--radius-sm);
  overflow: hidden;
}
.frame > i {
  position: absolute;
  background: linear-gradient(135deg,
              color-mix(in srgb, var(--accent) 34%, transparent),
              color-mix(in srgb, var(--accent-2) 24%, transparent));
  border: 1px solid color-mix(in srgb, var(--accent) 60%, transparent);
  border-radius: 3px;
  transition: inset .35s ease;
  inset: 0;
}
.framenote { font-size: 12px; color: var(--muted); }

/* --- VS10 --------------------------------------------------------------- */

.vs10 { padding: 14px 16px 16px; display: grid; gap: 12px; }
.vs10 .out {
  font-size: 13px;
  color: var(--muted);
  display: flex;
  gap: 8px;
  align-items: baseline;
  flex-wrap: wrap;
}
.vs10 .out b { color: var(--text); font-weight: 650; }

.modes {
  display: grid;
  gap: 10px;
  grid-template-columns: repeat(auto-fit, minmax(190px, 1fr));
}
.mode {
  appearance: none;
  min-height: var(--tap);
  padding: 11px 14px;
  border-radius: var(--radius-sm);
  border: 1px solid var(--line);
  background: var(--panel-2);
  color: var(--text);
  font: inherit;
  font-weight: 600;
  font-size: 14px;
  text-align: left;
  cursor: pointer;
  transition: border-color .15s, background .15s, transform .08s;
}
.mode:hover:not(:disabled) {
  border-color: var(--accent);
  background: color-mix(in srgb, var(--accent) 10%, var(--panel-2));
}
.mode:active:not(:disabled) { transform: scale(.985); }
.mode:disabled { opacity: .5; cursor: progress; }
.mode.busy { border-color: var(--accent); color: var(--accent); }

/* The active picture and the VS10 output, stacked like the cards below them:
   at the page's reading width two of these fit side by side, which put the
   one page's two halves out of step with each other. */
.panels {
  display: grid;
  gap: 16px;
  grid-template-columns: 1fr;
}
.panels:empty { display: none; }

/* --- Detail groups ------------------------------------------------------ */

/* Two cards to a row where there is room for two, one under the next where
   there is not.  A grid row is as tall as the taller of its two cards, so
   which card sits next to which is what decides whether that shows: the
   pairing in GROUP_ORDER puts blocks of a like length side by side, and the
   two then end level rather than one of them standing over a hole. */
.groups {
  display: grid;
  gap: 16px;
  grid-template-columns: 1fr;
}
@media (min-width: 760px) {
  .groups { grid-template-columns: repeat(2, minmax(0, 1fr)); }
}
/* The static HDR card takes the whole row.  It is two readings long, so as
   half a row it would leave its partner standing over a hole -- and it only
   appears at all on an HDR title that is not Dolby Vision, where it is the
   last card and has nothing to pair with anyway.  The id comes from the
   snapshot (see renderGroups). */
.groups > [data-group="hdr"] { grid-column: 1 / -1; }

.rows { padding: 4px 0 6px; }

.row {
  display: grid;
  grid-template-columns: minmax(96px, 38%) 1fr;
  gap: 12px;
  align-items: baseline;
  padding: 7px 16px;
}
.row + .row { border-top: 1px solid var(--line-soft); }
.row .k { color: var(--muted); font-size: 13px; overflow-wrap: anywhere; }
.row .v {
  font-size: 13.5px;
  text-align: right;
  overflow-wrap: anywhere;
  transition: color .45s ease-out;
}
.row .d { color: var(--dim); font-size: 12.5px; }
.row.changed .v { color: var(--accent-2); transition: none; }

/* --- Empty state -------------------------------------------------------- */

.empty {
  padding: 48px 24px;
  text-align: center;
  display: grid;
  gap: 8px;
  justify-items: center;
}
.empty .big { font-size: 17px; font-weight: 600; }
.empty p { margin: 0; color: var(--muted); font-size: 13.5px; max-width: 42ch; }

/* --- Link to the metadata window ---------------------------------------- */

/* Its own window rather than a section here: the list is long enough to bury
   everything under it, and on a second screen it is worth a screen of its own.
   A real link, so it can be opened in a tab, a window or not at all. */
.metalink {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 16px;
  min-height: var(--tap);
  border-radius: var(--radius);
  border: 1px solid var(--line-soft);
  background: var(--panel);
  box-shadow: var(--shadow);
  color: var(--text);
  text-decoration: none;
  font-weight: 600;
  transition: border-color .15s, background .15s;
}
.metalink:hover {
  border-color: var(--accent);
  background: color-mix(in srgb, var(--accent) 8%, var(--panel));
}
.metalink:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.metalink .dv {
  font-size: 10.5px;
  font-weight: 700;
  letter-spacing: .1em;
  text-transform: uppercase;
  color: var(--accent);
  border: 1px solid color-mix(in srgb, var(--accent) 45%, transparent);
  border-radius: 999px;
  padding: 3px 9px;
  white-space: nowrap;
}
.metalink .arrow { margin-left: auto; color: var(--muted); font-size: 18px; }

</style>
</head>

<body>

<header class="topbar">
  <div class="brand">
    <b>TinyPPI</b><span class="ver" id="version"></span>
  </div>
  <div class="status" id="status" data-state="wait" role="status" aria-live="polite">
    <span class="dot"></span><span id="statusText">…</span>
  </div>
  <button class="iconbtn hidden" id="wakeBtn" type="button" aria-pressed="false">
    <span aria-hidden="true">☀</span> <span class="lbl"></span>
  </button>
  <button class="iconbtn" id="tokenBtn" type="button" title="Token" aria-label="Token">
    <img class="ui-icon" src="/icons/key.svg" alt="">
  </button>
</header>

<main>
  <div id="live"></div>

  <section class="card hidden" id="idleCard">
    <div class="empty">
      <div class="big" id="idleTitle">—</div>
      <p id="idleText"></p>
    </div>
  </section>

  <div class="panels">
  <section class="card hidden" id="vs10Card">
    <h2 id="vs10Title"></h2>
    <div class="vs10">
      <div class="out"><span id="vs10OutLabel"></span><b id="vs10Out">—</b></div>
      <div class="modes" id="modes"></div>
    </div>
  </section>

  <section class="card hidden" id="frameCard">
    <h2 id="frameTitle"></h2>
    <div class="framewrap">
      <div class="frame"><i id="frameActive"></i></div>
      <div class="framenote mono" id="frameNote"></div>
    </div>
  </section>

  </div>

  <div class="groups" id="groups"></div>


  <a class="metalink hidden" id="metaLink" href="/metadata" target="tinyppi-metadata"
     rel="noopener">
    <span class="dv">DV</span><span id="metaLinkText"></span><span class="arrow">↗</span>
  </a>

  <footer>
    <span id="foot"></span>
    <button class="ghost" id="copyBtn" type="button"></button>
  </footer>
</main>

<script src="/stream.js"></script>
<script>
"use strict";

/* ===========================================================================
   TinyPPI second-screen dashboard.

   Everything printed here comes from the snapshot TinyPPI.boot delivers; the
   labels come translated with it, out of Kodi's own string table.  The
   connection itself lives in stream.js, which this page shares with the
   metadata window.
=========================================================================== */

const $ = TinyPPI.$;
const T = TinyPPI.T;

const el = {
  version: $("version"), idleCard: $("idleCard"),
  frameCard: $("frameCard"), frameActive: $("frameActive"), frameNote: $("frameNote"),
  vs10Card: $("vs10Card"), vs10Out: $("vs10Out"), modes: $("modes"),
  groups: $("groups"), foot: $("foot"),
  metaLink: $("metaLink"), wakeBtn: $("wakeBtn"), copyBtn: $("copyBtn")
};

let state = null;
let control = false;
let rowNodes = new Map();  /* row id -> {element, key, value, last}     */
let groupNodes = new Map();
let pending = null;        /* the VS10 mode a button is waiting on      */

/* --- render ------------------------------------------------------------- */

function render(next) {
  state = next;
  control = !!next.control;

  /* What is playing, the tiles and the chart belong to the metadata window
     too, and are drawn by the module both pages share: it reads the same
     snapshot and takes itself off the page when nothing is playing. */
  TinyPPI.panels.update(next);

  if (!next.playing) {
    el.idleCard.classList.remove("hidden");
    /* The copy button goes with them: with nothing playing there is no report
       to write, and a button that answers a press with nothing is worse than
       one that is not there. */
    for (const id of ["frameCard", "vs10Card", "metaLink", "copyBtn"]) {
      $(id).classList.add("hidden");
    }
    el.groups.innerHTML = "";
    rowNodes.clear();
    groupNodes.clear();
    return;
  }

  el.idleCard.classList.add("hidden");
  el.copyBtn.classList.remove("hidden");

  renderFrame(next.metrics || {});
  renderVs10(next.vs10 || {});
  renderGroups(ordered(next.groups || []));
  /* The metadata list is a window of its own; this page only says whether
     there is one to open. */
  el.metaLink.classList.toggle("hidden", !(next.metadata && next.metadata.length));
}

/* --- active picture ----------------------------------------------------- */

function renderFrame(metrics) {
  const bars = metrics.bars, frame = metrics.frame;
  if (!bars || !frame || !frame.w || !frame.h) {
    el.frameCard.classList.add("hidden");
    return;
  }
  el.frameCard.classList.remove("hidden");
  const [left, right, top, bottom] = bars;
  const box = el.frameActive.parentElement;
  box.style.aspectRatio = frame.w + " / " + frame.h;
  el.frameActive.style.inset =
    (top / frame.h * 100) + "% " + (right / frame.w * 100) + "% " +
    (bottom / frame.h * 100) + "% " + (left / frame.w * 100) + "%";
  el.frameNote.textContent =
    frame.w + "×" + frame.h + "   L " + left + "  R " + right +
    "  T " + top + "  B " + bottom;
}

/* --- VS10 --------------------------------------------------------------- */

function renderVs10(vs10) {
  const options = vs10.options || [];
  if (!control || !options.length) {
    el.vs10Card.classList.add("hidden");
    return;
  }
  el.vs10Card.classList.remove("hidden");
  el.vs10Out.textContent = vs10.output || "—";

  const signature = options.map((option) => option.mode).join("|");
  if (el.modes.dataset.signature !== signature) {
    el.modes.dataset.signature = signature;
    el.modes.innerHTML = "";
    for (const option of options) {
      const button = document.createElement("button");
      button.type = "button";
      button.className = "mode";
      button.dataset.mode = option.mode;
      button.textContent = option.label;
      button.addEventListener("click", () => switchMode(option.mode, button));
      el.modes.appendChild(button);
    }
  }
}

async function switchMode(mode, button) {
  if (pending) return;
  pending = mode;
  for (const node of el.modes.children) node.disabled = true;
  button.classList.add("busy");
  TinyPPI.toast(T.switching);
  try {
    const response = await fetch("/api/mode", {
      method: "POST",
      headers: { "Content-Type": "application/json", "X-TinyPPI-Token": TinyPPI.token },
      body: JSON.stringify({ mode })
    });
    if (response.status === 401) {
      TinyPPI.toast(T.token_bad, true);
      TinyPPI.askToken();
    } else if (!response.ok) {
      TinyPPI.toast(T.switch_failed, true);
    } else {
      TinyPPI.toast(T.switched);
    }
  } catch (_) {
    TinyPPI.toast(T.switch_failed, true);
  } finally {
    /* The driver needs a moment to settle before the next snapshot shows the
       new output; keep the buttons locked until then rather than inviting a
       second press into the middle of the switch. */
    setTimeout(() => {
      pending = null;
      button.classList.remove("busy");
      for (const node of el.modes.children) node.disabled = false;
    }, 1200);
  }
}

/* --- detail groups ------------------------------------------------------ */

/* The order the cards are laid out in, by the group ids the snapshot carries.
   The snapshot names them in an order of its own (web/snapshot.py _GROUPS),
   but that one lives in the service, which reads its code once when Kodi
   starts -- so the layout is decided here instead, where reloading the page
   is enough to change it.  A group not named here keeps its place, after the
   ones that are.

   Read in pairs, because the cards stand two to a row: picture beside sound,
   what was done to it beside what it declares itself to be, the machine
   beside the numbers.  Each pair is also two blocks of roughly one length,
   which is what keeps the rows from ending ragged.  The static HDR card is
   last because it only appears at all on an HDR title that is not Dolby
   Vision -- where the two cards after it are absent (see snapshot.py). */
const GROUP_ORDER =
  ["video", "audio", "processing", "dv", "system", "metadata", "hdr"];

function ordered(groups) {
  const rank = (group) => {
    const at = GROUP_ORDER.indexOf(group.id);
    return at === -1 ? GROUP_ORDER.length : at;
  };
  return [...groups].sort((first, second) => rank(first) - rank(second));
}

function renderGroups(groups) {
  const seen = new Set();

  groups.forEach((group, index) => {
    seen.add(group.id);
    let card = groupNodes.get(group.id);
    if (!card) {
      card = document.createElement("section");
      card.className = "card";
      const heading = document.createElement("h2");
      heading.textContent = group.title;
      const rows = document.createElement("div");
      rows.className = "rows";
      card.append(heading, rows);
      card.dataset.group = group.id;
      groupNodes.set(group.id, card);
    }
    /* Placed on every pass, not just when the card is made: the groups do not
       all arrive with the first snapshot -- the system readings settle after
       playback has run for a moment, the HDR blocks once the source is known
       -- and a card merely appended would keep whatever place it was late to,
       rather than the one the snapshot gives it. */
    const at = el.groups.children[index];
    if (at !== card) el.groups.insertBefore(card, at || null);
    renderRows(card.querySelector(".rows"), group);
  });

  for (const [id, card] of groupNodes) {
    if (!seen.has(id)) { card.remove(); groupNodes.delete(id); }
  }
}

function renderRows(container, group) {
  const wanted = group.rows.map((row) => row.id);
  const seen = new Set(wanted);

  group.rows.forEach((row, index) => {
    let node = rowNodes.get(row.id);
    if (!node) {
      const element = document.createElement("div");
      element.className = "row";
      const key = document.createElement("span");
      key.className = "k";
      const value = document.createElement("span");
      value.className = "v mono";
      element.append(key, value);
      node = { element, key, value, last: null, timer: 0 };
      rowNodes.set(row.id, node);
    }
    /* Keep the DOM in the order the snapshot names, so a row that appears
       mid-title lands where it belongs instead of at the end. */
    const at = container.children[index];
    if (at !== node.element) container.insertBefore(node.element, at || null);

    node.key.textContent = row.label;
    const text = row.detail ? row.value + "  " : row.value;
    if (node.last !== row.value + "\n" + row.detail) {
      if (node.last !== null) flash(node);
      node.last = row.value + "\n" + row.detail;
      node.value.textContent = text;
      if (row.detail) {
        const detail = document.createElement("span");
        detail.className = "d";
        detail.textContent = row.detail;
        node.value.append(detail);
      }
    }
  });

  for (const [id, node] of rowNodes) {
    if (id.startsWith(group.id + ".") && !seen.has(id)) {
      node.element.remove();
      rowNodes.delete(id);
    }
  }
}

/* Mirrors the overlay's own highlight: a reading that moved is written in the
   change color and fades back, so the live values stand out from the fixed
   ones without slowing the refresh down. */
function flash(node) {
  node.element.classList.add("changed");
  clearTimeout(node.timer);
  node.timer = setTimeout(() => node.element.classList.remove("changed"), 750);
}

/* --- report ------------------------------------------------------------- */

function buildReport() {
  if (!state || !state.playing) return "";
  const lines = ["TinyPPI"];
  if (state.title) lines.push(state.title);
  if (state.filename) lines.push(state.filename);
  lines.push("");
  for (const group of ordered(state.groups || [])) {
    lines.push("[" + group.title + "]");
    for (const row of group.rows) {
      const detail = row.detail ? "  (" + row.detail + ")" : "";
      lines.push(TinyPPI.reportLine(row.label, row.value + detail));
    }
    lines.push("");
  }
  return lines.join("\n");
}

/* The clipboard, or a file named after the film where the browser will not
   give it the clipboard; both pages hand it over the same way (see
   TinyPPI.copyReport). */
el.copyBtn.addEventListener("click", () => {
  TinyPPI.copyReport(buildReport(), (state || {}).title);
});

/* --- wake lock ---------------------------------------------------------- */

let wakeLock = null;
if ("wakeLock" in navigator) {
  el.wakeBtn.classList.remove("hidden");
  el.wakeBtn.addEventListener("click", async () => {
    if (wakeLock) {
      await wakeLock.release().catch(() => {});
      wakeLock = null;
      el.wakeBtn.setAttribute("aria-pressed", "false");
      return;
    }
    try {
      wakeLock = await navigator.wakeLock.request("screen");
      wakeLock.addEventListener("release", () => {
        wakeLock = null;
        el.wakeBtn.setAttribute("aria-pressed", "false");
      });
      el.wakeBtn.setAttribute("aria-pressed", "true");
    } catch (_) { /* denied; the button simply stays off */ }
  });
  document.addEventListener("visibilitychange", async () => {
    if (document.visibilityState === "visible" &&
        el.wakeBtn.getAttribute("aria-pressed") === "true" && !wakeLock) {
      try { wakeLock = await navigator.wakeLock.request("screen"); } catch (_) {}
    }
  });
}


/* --- boot --------------------------------------------------------------- */

function applyStrings(strings, hello) {
  $("idleTitle").textContent = strings.idle_title;
  $("idleText").textContent = strings.idle_text;
  TinyPPI.panels.strings(strings);
  $("frameTitle").textContent = strings.active_area;
  $("vs10Title").textContent = strings.vs10;
  $("vs10OutLabel").textContent = strings.output;
  $("metaLinkText").textContent = strings.metadata;
  el.copyBtn.textContent = strings.copy;
  el.wakeBtn.querySelector(".lbl").textContent = strings.awake;
  el.wakeBtn.setAttribute("aria-label", strings.awake);
  el.wakeBtn.title = strings.awake;
  if (hello) {
    el.version.textContent = "v" + hello.version;
    el.foot.textContent = "TinyPPI " + hello.version;
  }
}

TinyPPI.boot({ onState: render, onStrings: applyStrings });
</script>
</body>
</html>

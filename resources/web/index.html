<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark light">
<meta name="theme-color" content="#0b0d10">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="robots" content="noindex, nofollow">
<title>TinyPPI</title>
<link rel="manifest" href="/manifest.webmanifest">
<link rel="apple-touch-icon" href="/icon.jpg">
<link rel="icon" href="/icon.jpg">
<link rel="stylesheet" href="/css/base.css">
<link rel="stylesheet" href="/css/live-panels.css">
<link rel="stylesheet" href="/css/dashboard.css">
</head>

<body>

<header class="topbar">
  <div class="brand">
    <b>TinyPPI</b><span class="ver" id="version"></span>
  </div>
  <button class="iconbtn hidden" id="wakeBtn" type="button" aria-pressed="false">
    <span aria-hidden="true">☀</span> <span class="lbl"></span>
  </button>
  <button class="iconbtn hidden" id="copyBtn" type="button">
    <img class="ui-icon" src="/icons/download.svg" alt="">
  </button>
  <button class="iconbtn" id="tokenBtn" type="button" title="Token" aria-label="Token">
    <img class="ui-icon" src="/icons/key.svg" alt="">
  </button>
  <div class="status" id="status" data-state="wait" role="status" aria-live="polite">
    <span class="dot"></span><span id="statusText">…</span>
  </div>
</header>

<main>
  <div id="live"></div>

  <section class="card hidden" id="idleCard">
    <div class="empty">
      <div class="big" id="idleTitle">—</div>
      <p id="idleText"></p>
    </div>
  </section>

  <div class="panels">
  <section class="card hidden" id="vs10Card">
    <h2 id="vs10Title"></h2>
    <div class="vs10">
      <div class="out"><span id="vs10OutLabel"></span><b id="vs10Out">—</b></div>
      <div class="modes" id="modes"></div>
    </div>
  </section>

  <section class="card hidden" id="frameCard">
    <h2 id="frameTitle"></h2>
    <div class="framewrap">
      <div class="frame"><i id="frameActive"></i></div>
      <div class="framenote mono" id="frameNote"></div>
    </div>
  </section>

  </div>

  <div class="groups" id="groups"></div>


  <a class="metalink hidden" id="metaLink" href="/metadata" target="tinyppi-metadata"
     rel="noopener">
    <span class="dv">DV</span><span id="metaLinkText"></span><span class="arrow">↗</span>
  </a>
</main>

<script src="/js/core.js"></script>
<script src="/js/live-panels.js"></script>
<script src="/js/dashboard.js"></script>
</body>
</html>

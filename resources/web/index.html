<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark light">
<meta name="theme-color" content="#0b0d10">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="robots" content="noindex, nofollow">
<title>TinyPPI</title>
<link rel="manifest" href="/manifest.webmanifest">
<link rel="apple-touch-icon" href="/icon.jpg">
<link rel="icon" href="/icon.jpg">
<style>
/* ---------------------------------------------------------------------------
   Palette.  Dark first: this is watched in a dark room next to a projector.
   The light block only restates the tokens, never a rule.
--------------------------------------------------------------------------- */
:root {
  --bg:        #0b0d10;
  --bg-glow:   #12181f;
  --panel:     #14181d;
  --panel-2:   #1a1f26;
  --line:      #242c36;
  --line-soft: #1d232b;
  --text:      #e8ecf1;
  --muted:     #8b97a6;
  --dim:       #5d6875;
  --accent:    #4fc3f7;
  --accent-2:  #82b1ff;
  --ok:        #81c784;
  --warn:      #ffb74d;
  --bad:       #ff5252;
  --shadow:    0 1px 0 rgba(255,255,255,.03), 0 8px 24px rgba(0,0,0,.35);
  --radius:    14px;
  --radius-sm: 10px;
  --tap:       44px;
}
/* The page follows the viewer's own setting.  The palette above is the dark
   one, so only the tokens are restated here, never a rule; a data-theme="dark"
   on <html> would pin it back to dark for a viewer who wants that. */
@media (prefers-color-scheme: light) {
  :root:not([data-theme="dark"]) {
    --bg:        #eef1f5;
    --bg-glow:   #e3e8ef;
    --panel:     #ffffff;
    --panel-2:   #f5f7fa;
    --line:      #dbe1e9;
    --line-soft: #e7ebf1;
    --text:      #16202b;
    --muted:     #5b6675;
    --dim:       #8b97a6;
    --accent:    #0277bd;
    --accent-2:  #1a56db;
    --ok:        #2e7d32;
    --warn:      #b26a00;
    --bad:       #c62828;
    --shadow:    0 1px 2px rgba(16,32,48,.06), 0 8px 20px rgba(16,32,48,.08);
  }
}

* { box-sizing: border-box; }

html, body {
  margin: 0;
  padding: 0;
  background: var(--bg);
  color: var(--text);
}

body {
  font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", sans-serif;
  font-size: 15px;
  line-height: 1.45;
  min-height: 100vh;
  min-height: 100dvh;
  -webkit-font-smoothing: antialiased;
  background-image: radial-gradient(120% 60% at 50% -10%, var(--bg-glow) 0%, var(--bg) 60%);
  background-attachment: fixed;
  padding-bottom: calc(24px + env(safe-area-inset-bottom));
}

.mono {
  font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas,
               "Liberation Mono", monospace;
  font-variant-numeric: tabular-nums;
  font-feature-settings: "tnum" 1;
}

/* --- Top bar ------------------------------------------------------------ */

.topbar {
  position: sticky;
  top: 0;
  z-index: 20;
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 10px 16px;
  padding-top: calc(10px + env(safe-area-inset-top));
  background: color-mix(in srgb, var(--bg) 86%, transparent);
  backdrop-filter: blur(12px);
  -webkit-backdrop-filter: blur(12px);
  border-bottom: 1px solid var(--line-soft);
}

.brand {
  display: flex;
  align-items: baseline;
  gap: 8px;
  font-weight: 650;
  letter-spacing: .2px;
  margin-right: auto;
  min-width: 0;
}
.brand b { font-weight: 700; }
.brand .ver { color: var(--dim); font-size: 11px; font-weight: 500; }
@media (max-width: 620px) {
  .brand .ver { display: none; }
  .iconbtn .lbl { display: none; }
  .iconbtn { padding: 0 10px; min-width: 40px; }
  .topbar { gap: 8px; padding-left: 12px; padding-right: 12px; }
}

.status {
  display: inline-flex;
  align-items: center;
  gap: 7px;
  font-size: 12.5px;
  color: var(--muted);
  white-space: nowrap;
}
.dot {
  width: 8px; height: 8px;
  border-radius: 50%;
  background: var(--dim);
  flex: none;
}
.status[data-state="live"] .dot {
  background: var(--ok);
  box-shadow: 0 0 0 0 color-mix(in srgb, var(--ok) 70%, transparent);
  animation: pulse 2.4s ease-out infinite;
}
.status[data-state="wait"] .dot { background: var(--warn); }
.status[data-state="down"] .dot { background: var(--bad); }
@keyframes pulse {
  0%   { box-shadow: 0 0 0 0 color-mix(in srgb, var(--ok) 55%, transparent); }
  70%  { box-shadow: 0 0 0 7px transparent; }
  100% { box-shadow: 0 0 0 0 transparent; }
}

.iconbtn {
  appearance: none;
  min-width: var(--tap);
  min-height: 36px;
  padding: 0 12px;
  border: 1px solid var(--line);
  border-radius: 999px;
  background: var(--panel);
  color: var(--muted);
  font: inherit;
  font-size: 13px;
  cursor: pointer;
  transition: color .15s, border-color .15s, background .15s;
}
.iconbtn:hover  { color: var(--text); border-color: var(--accent); }
.iconbtn[aria-pressed="true"] { color: var(--accent); border-color: var(--accent); }
.iconbtn:focus-visible,
.mode:focus-visible,
.ghost:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

/* --- Shell -------------------------------------------------------------- */

main {
  max-width: 1360px;
  margin: 0 auto;
  padding: 16px;
  display: grid;
  gap: 16px;
}

.card {
  background: var(--panel);
  border: 1px solid var(--line-soft);
  border-radius: var(--radius);
  box-shadow: var(--shadow);
  overflow: hidden;
}

.card > h2 {
  margin: 0;
  padding: 12px 16px 10px;
  font-size: 11.5px;
  font-weight: 700;
  letter-spacing: .12em;
  text-transform: uppercase;
  color: var(--muted);
  border-bottom: 1px solid var(--line-soft);
}

/* --- Now playing -------------------------------------------------------- */

.now {
  padding: 18px 16px 16px;
  display: grid;
  gap: 12px;
}

.badges { display: flex; flex-wrap: wrap; gap: 6px; }

.badge {
  font-size: 11px;
  font-weight: 700;
  letter-spacing: .08em;
  text-transform: uppercase;
  padding: 4px 9px;
  border-radius: 999px;
  border: 1px solid color-mix(in srgb, var(--accent) 45%, transparent);
  color: var(--accent);
  background: color-mix(in srgb, var(--accent) 12%, transparent);
  white-space: nowrap;
}
.badge.alt {
  border-color: color-mix(in srgb, var(--warn) 45%, transparent);
  color: var(--warn);
  background: color-mix(in srgb, var(--warn) 12%, transparent);
}

.now h1 {
  margin: 0;
  font-size: clamp(19px, 4.4vw, 26px);
  line-height: 1.2;
  font-weight: 650;
  overflow-wrap: anywhere;
}
.now .file {
  margin: 0;
  font-size: 12.5px;
  color: var(--dim);
  overflow-wrap: anywhere;
}

.progress {
  display: grid;
  gap: 6px;
}
.track {
  height: 6px;
  border-radius: 999px;
  background: var(--panel-2);
  overflow: hidden;
}
.track > i {
  display: block;
  height: 100%;
  width: 0%;
  border-radius: 999px;
  background: linear-gradient(90deg, var(--accent), var(--accent-2));
  transition: width .35s linear;
}
.times {
  display: flex;
  justify-content: space-between;
  font-size: 12.5px;
  color: var(--muted);
}

/* --- Stat tiles --------------------------------------------------------- */

.tiles {
  display: grid;
  gap: 12px;
  grid-template-columns: repeat(auto-fit, minmax(148px, 1fr));
}

.tile {
  background: var(--panel);
  border: 1px solid var(--line-soft);
  border-radius: var(--radius);
  box-shadow: var(--shadow);
  padding: 14px 15px;
  display: grid;
  gap: 4px;
  align-content: start;
}
.tile .k {
  font-size: 10.5px;
  font-weight: 700;
  letter-spacing: .1em;
  text-transform: uppercase;
  color: var(--muted);
}
.tile .v {
  font-size: clamp(20px, 5vw, 27px);
  font-weight: 650;
  line-height: 1.1;
}
.tile .u { font-size: 12px; color: var(--dim); font-weight: 500; }

/* --- Chart -------------------------------------------------------------- */

.chartwrap { padding: 12px 12px 14px; }
#chart {
  display: block;
  width: 100%;
  height: 190px;
  border-radius: var(--radius-sm);
  background: var(--panel-2);
}
@media (max-width: 640px) { #chart { height: 148px; } }

.legend {
  display: flex;
  flex-wrap: wrap;
  gap: 14px;
  padding: 10px 4px 0;
  font-size: 12px;
  color: var(--muted);
}
.legend span { display: inline-flex; align-items: center; gap: 6px; }
.swatch { width: 12px; height: 3px; border-radius: 2px; background: var(--accent); }
.swatch.band { height: 10px; border-radius: 3px; opacity: .4; }
.swatch.avg {
  background: transparent;
  border-top: 2px dashed var(--accent-2);
  height: 0;
}

/* --- Active picture ----------------------------------------------------- */

.framewrap {
  padding: 14px 16px 16px;
  display: grid;
  gap: 10px;
  justify-items: center;
}
.frame {
  position: relative;
  width: 100%;
  max-width: 420px;
  aspect-ratio: 16 / 9;
  background: #05070a;
  border: 1px solid var(--line);
  border-radius: var(--radius-sm);
  overflow: hidden;
}
.frame > i {
  position: absolute;
  background: linear-gradient(135deg,
              color-mix(in srgb, var(--accent) 34%, transparent),
              color-mix(in srgb, var(--accent-2) 24%, transparent));
  border: 1px solid color-mix(in srgb, var(--accent) 60%, transparent);
  border-radius: 3px;
  transition: inset .35s ease;
  inset: 0;
}
.framenote { font-size: 12px; color: var(--muted); }

/* --- VS10 --------------------------------------------------------------- */

.vs10 { padding: 14px 16px 16px; display: grid; gap: 12px; }
.vs10 .out {
  font-size: 13px;
  color: var(--muted);
  display: flex;
  gap: 8px;
  align-items: baseline;
  flex-wrap: wrap;
}
.vs10 .out b { color: var(--text); font-weight: 650; }

.modes {
  display: grid;
  gap: 10px;
  grid-template-columns: repeat(auto-fit, minmax(190px, 1fr));
}
.mode {
  appearance: none;
  min-height: var(--tap);
  padding: 11px 14px;
  border-radius: var(--radius-sm);
  border: 1px solid var(--line);
  background: var(--panel-2);
  color: var(--text);
  font: inherit;
  font-weight: 600;
  font-size: 14px;
  text-align: left;
  cursor: pointer;
  transition: border-color .15s, background .15s, transform .08s;
}
.mode:hover:not(:disabled) {
  border-color: var(--accent);
  background: color-mix(in srgb, var(--accent) 10%, var(--panel-2));
}
.mode:active:not(:disabled) { transform: scale(.985); }
.mode:disabled { opacity: .5; cursor: progress; }
.mode.busy { border-color: var(--accent); color: var(--accent); }

.panels {
  display: grid;
  gap: 16px;
  grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
  align-items: start;
}
.panels:empty { display: none; }

/* --- Detail groups ------------------------------------------------------ */

.groups {
  display: grid;
  gap: 16px;
  grid-template-columns: repeat(auto-fill, minmax(330px, 1fr));
  align-items: start;
}

.rows { padding: 4px 0 6px; }

.row {
  display: grid;
  grid-template-columns: minmax(96px, 38%) 1fr;
  gap: 12px;
  align-items: baseline;
  padding: 7px 16px;
}
.row + .row { border-top: 1px solid var(--line-soft); }
.row .k { color: var(--muted); font-size: 13px; overflow-wrap: anywhere; }
.row .v {
  font-size: 13.5px;
  text-align: right;
  overflow-wrap: anywhere;
  transition: color .45s ease-out;
}
.row .d { color: var(--dim); font-size: 12.5px; }
.row.changed .v { color: var(--accent-2); transition: none; }

/* --- Dolby Vision metadata view ----------------------------------------- */

.meta > summary {
  padding: 12px 16px;
  font-size: 11.5px;
  font-weight: 700;
  letter-spacing: .12em;
  text-transform: uppercase;
  color: var(--muted);
  cursor: pointer;
  display: flex;
  gap: 12px;
  align-items: center;
  min-height: var(--tap);
  list-style-position: inside;
}
.meta[open] > summary { border-bottom: 1px solid var(--line-soft); }
.meta > summary:hover { color: var(--text); }
.meta > summary:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }
.meta > summary .count { margin-left: auto; letter-spacing: 0; font-weight: 500; }

.metarows { padding: 4px 0 12px; }

/* The metadata list is one long column on a phone and two on a wide screen:
   the sections are independent of each other, so they read fine side by side
   and the page stops being a mile long. */
@media (min-width: 900px) {
  .metarows { columns: 2; column-gap: 28px; padding: 8px 8px 14px; }
  .mblock   { break-inside: avoid; }
}

.msection {
  margin: 14px 16px 6px;
  padding-bottom: 5px;
  border-bottom: 1px solid var(--line);
  font-size: 12px;
  font-weight: 700;
  letter-spacing: .1em;
  text-transform: uppercase;
  color: var(--accent);
  display: flex;
  gap: 8px;
  align-items: baseline;
}
.msection .state {
  margin-left: auto;
  font-size: 10px;
  font-weight: 600;
  letter-spacing: .06em;
  color: var(--dim);
  text-transform: none;
}

.mrow {
  display: grid;
  grid-template-columns: minmax(110px, 45%) 1fr;
  gap: 10px;
  padding: 3px 16px;
  font-size: 12.5px;
}
.mrow .k { color: var(--muted); overflow-wrap: anywhere; }
.mrow .v { text-align: right; overflow-wrap: anywhere; }

.mwide {
  padding: 3px 16px;
  font-size: 12.5px;
  color: var(--text);
  overflow-wrap: anywhere;
}

/* A trim pass only means anything read against its neighbours, so its cells
   go in a scrolling row of fixed slots rather than wrapping into each other. */
.mtable { padding: 2px 16px; overflow-x: auto; }
.mtable > div {
  display: grid;
  grid-auto-flow: column;
  grid-auto-columns: minmax(62px, 1fr);
  gap: 8px;
  font-size: 12px;
  min-width: max-content;
}
.mtable .lead {
  grid-column: 1;
  min-width: 108px;
  color: var(--muted);
  text-align: left;
}
.mtable > div > span { text-align: right; }
.mhead > div > span { color: var(--dim); font-size: 10.5px;
                      text-transform: uppercase; letter-spacing: .06em; }

/* --- Empty state -------------------------------------------------------- */

.empty {
  padding: 48px 24px;
  text-align: center;
  display: grid;
  gap: 8px;
  justify-items: center;
}
.empty .big { font-size: 17px; font-weight: 600; }
.empty p { margin: 0; color: var(--muted); font-size: 13.5px; max-width: 42ch; }

/* --- Footer, toast, dialog ---------------------------------------------- */

footer {
  display: flex;
  flex-wrap: wrap;
  gap: 10px;
  align-items: center;
  justify-content: space-between;
  color: var(--dim);
  font-size: 12px;
  padding: 4px 2px;
}
.ghost {
  appearance: none;
  min-height: 38px;
  padding: 0 14px;
  border-radius: 999px;
  border: 1px solid var(--line);
  background: transparent;
  color: var(--muted);
  font: inherit;
  font-size: 13px;
  cursor: pointer;
}
.ghost:hover { color: var(--text); border-color: var(--accent); }

#toast {
  position: fixed;
  left: 50%;
  bottom: calc(20px + env(safe-area-inset-bottom));
  transform: translate(-50%, 16px);
  background: var(--panel);
  border: 1px solid var(--line);
  color: var(--text);
  padding: 10px 16px;
  border-radius: 999px;
  box-shadow: var(--shadow);
  font-size: 13.5px;
  opacity: 0;
  pointer-events: none;
  transition: opacity .2s, transform .2s;
  z-index: 40;
  max-width: calc(100vw - 32px);
  text-align: center;
}
#toast.show { opacity: 1; transform: translate(-50%, 0); }
#toast.bad { border-color: var(--bad); color: var(--bad); }

dialog {
  border: 1px solid var(--line);
  border-radius: var(--radius);
  background: var(--panel);
  color: var(--text);
  padding: 0;
  width: min(400px, calc(100vw - 32px));
  box-shadow: var(--shadow);
}
dialog::backdrop { background: rgba(0,0,0,.6); backdrop-filter: blur(3px); }
dialog form { padding: 18px; display: grid; gap: 12px; }
dialog h3 { margin: 0; font-size: 16px; }
dialog p { margin: 0; color: var(--muted); font-size: 13px; }
dialog input {
  font: inherit;
  font-size: 18px;
  letter-spacing: .18em;
  text-transform: uppercase;
  padding: 11px 12px;
  border-radius: var(--radius-sm);
  border: 1px solid var(--line);
  background: var(--panel-2);
  color: var(--text);
  width: 100%;
}
dialog input:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
.dlgrow { display: flex; gap: 10px; justify-content: flex-end; }
.dlgrow button {
  appearance: none;
  min-height: var(--tap);
  padding: 0 18px;
  border-radius: var(--radius-sm);
  border: 1px solid var(--line);
  background: var(--panel-2);
  color: var(--text);
  font: inherit;
  font-weight: 600;
  cursor: pointer;
}
.dlgrow button[value="ok"] {
  background: var(--accent);
  border-color: var(--accent);
  color: #05131c;
}

.hidden { display: none !important; }

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    animation-duration: .001ms !important;
    animation-iteration-count: 1 !important;
    transition-duration: .001ms !important;
  }
}
</style>
</head>
<body>

<header class="topbar">
  <div class="brand">
    <b>TinyPPI</b><span class="ver" id="version"></span>
  </div>
  <div class="status" id="status" data-state="wait" role="status" aria-live="polite">
    <span class="dot"></span><span id="statusText">…</span>
  </div>
  <button class="iconbtn hidden" id="wakeBtn" type="button" aria-pressed="false">
    <span aria-hidden="true">☀</span> <span class="lbl"></span>
  </button>
  <button class="iconbtn" id="tokenBtn" type="button" title="Token">🔑</button>
</header>

<main>
  <section class="card" id="nowCard">
    <div class="now">
      <div class="badges" id="badges"></div>
      <h1 id="title">—</h1>
      <p class="file mono hidden" id="file"></p>
      <div class="progress">
        <div class="track"><i id="bar"></i></div>
        <div class="times mono">
          <span id="tElapsed">--:--</span><span id="tTotal">--:--</span>
        </div>
      </div>
    </div>
  </section>

  <section class="card hidden" id="idleCard">
    <div class="empty">
      <div class="big" id="idleTitle">—</div>
      <p id="idleText"></p>
    </div>
  </section>

  <section class="tiles hidden" id="tiles">
    <div class="tile" id="tPeak"><span class="k" id="kPeak"></span>
      <span class="v mono" id="vPeak">—</span><span class="u">nits</span></div>
    <div class="tile" id="tAvg"><span class="k" id="kAvg"></span>
      <span class="v mono" id="vAvg">—</span><span class="u">nits</span></div>
    <div class="tile"><span class="k" id="kAr"></span>
      <span class="v mono" id="vAr">—</span><span class="u">&nbsp;</span></div>
    <div class="tile"><span class="k" id="kFps"></span>
      <span class="v mono" id="vFps">—</span><span class="u" id="uFps">&nbsp;</span></div>
  </section>

  <section class="card hidden" id="chartCard">
    <h2 id="chartTitle"></h2>
    <div class="chartwrap">
      <canvas id="chart" role="img"></canvas>
      <div class="legend">
        <span><i class="swatch band"></i>Max</span>
        <span><i class="swatch avg"></i>Ø</span>
        <span id="chartScale" style="margin-left:auto"></span>
      </div>
    </div>
  </section>

  <div class="panels">
  <section class="card hidden" id="frameCard">
    <h2 id="frameTitle"></h2>
    <div class="framewrap">
      <div class="frame"><i id="frameActive"></i></div>
      <div class="framenote mono" id="frameNote"></div>
    </div>
  </section>

  <section class="card hidden" id="vs10Card">
    <h2 id="vs10Title"></h2>
    <div class="vs10">
      <div class="out"><span id="vs10OutLabel"></span><b id="vs10Out">—</b></div>
      <div class="modes" id="modes"></div>
    </div>
  </section>

  </div>

  <div class="groups" id="groups"></div>

  <details class="card meta hidden" id="metaCard">
    <summary><span id="metaTitle"></span><span class="count mono" id="metaCount"></span></summary>
    <div class="metarows" id="metaRows"></div>
  </details>

  <footer>
    <span id="foot"></span>
    <button class="ghost" id="copyBtn" type="button"></button>
  </footer>
</main>

<div id="toast" role="status" aria-live="polite"></div>

<dialog id="tokenDialog">
  <form method="dialog">
    <h3 id="dlgTitle"></h3>
    <p id="dlgText"></p>
    <input id="tokenInput" autocomplete="off" autocapitalize="characters"
           spellcheck="false" inputmode="text" maxlength="32" aria-labelledby="dlgTitle">
    <div class="dlgrow">
      <button value="cancel" id="dlgCancel" type="submit"></button>
      <button value="ok" id="dlgOk" type="submit"></button>
    </div>
  </form>
</dialog>

<script>
"use strict";

/* ===========================================================================
   TinyPPI second-screen dashboard.

   One EventSource carries the same snapshot the add-on's producer builds, so
   the page never polls.  Everything it prints comes from the snapshot; the
   labels come translated with it, out of Kodi's own string table.
=========================================================================== */

const TOKEN_KEY = "tinyppi.token";
const HISTORY_SECONDS = 60;

/* Chrome strings, replaced by the localized set from /api/hello. */
let T = {
  connected: "Connected", connecting: "Connecting…", offline: "Disconnected",
  metadata: "Dolby Vision metadata view",
  idle_title: "Nothing is playing", idle_text: "",
  peak: "Peak", average: "Average", aspect: "Aspect ratio", fps: "FPS",
  chart: "Frame luminance", active_area: "Active picture", vs10: "VS10 output",
  output: "Output", copy: "Copy report", copied: "Copied", awake: "Keep awake",
  token_title: "Access token", token_text: "", save: "Save", cancel: "Cancel",
  token_bad: "Wrong or missing token", switching: "Switching…",
  switched: "Switched", switch_failed: "Switching failed"
};

const $ = (id) => document.getElementById(id);

const el = {
  status: $("status"), statusText: $("statusText"), version: $("version"),
  badges: $("badges"), title: $("title"), file: $("file"),
  bar: $("bar"), tElapsed: $("tElapsed"), tTotal: $("tTotal"),
  nowCard: $("nowCard"), idleCard: $("idleCard"),
  tiles: $("tiles"), tPeak: $("tPeak"), tAvg: $("tAvg"),
  vPeak: $("vPeak"), vAvg: $("vAvg"), vAr: $("vAr"), vFps: $("vFps"), uFps: $("uFps"),
  chartCard: $("chartCard"), chart: $("chart"), chartScale: $("chartScale"),
  frameCard: $("frameCard"), frameActive: $("frameActive"), frameNote: $("frameNote"),
  vs10Card: $("vs10Card"), vs10Out: $("vs10Out"), modes: $("modes"),
  groups: $("groups"), toast: $("toast"), foot: $("foot"),
  metaCard: $("metaCard"), metaRows: $("metaRows"), metaCount: $("metaCount"),
  dialog: $("tokenDialog"), tokenInput: $("tokenInput"),
  wakeBtn: $("wakeBtn"), copyBtn: $("copyBtn")
};

let token = localStorage.getItem(TOKEN_KEY) || "";
let state = null;
let control = false;
let history = [];          /* {t, min, max, avg} for the chart          */
let rowNodes = new Map();  /* row id -> {row, value, detail, last}      */
let groupNodes = new Map();
let pending = null;        /* the VS10 mode a button is waiting on      */

/* --- helpers ------------------------------------------------------------ */

function withToken(url) {
  return token ? url + (url.includes("?") ? "&" : "?") + "token=" + encodeURIComponent(token) : url;
}

let toastTimer = 0;
function toast(message, bad) {
  el.toast.textContent = message;
  el.toast.classList.toggle("bad", !!bad);
  el.toast.classList.add("show");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.toast.classList.remove("show"), 2600);
}

function setStatus(kind, text) {
  el.status.dataset.state = kind;
  el.statusText.textContent = text;
}

function fmtNits(value) {
  if (value === null || value === undefined) return "—";
  if (value >= 1000) return Math.round(value).toLocaleString();
  if (value >= 100)  return value.toFixed(0);
  if (value >= 10)   return value.toFixed(1);
  if (value >= 1)    return value.toFixed(2);
  return value.toFixed(4).replace(/0+$/, "").replace(/\.$/, "");
}

/* --- token -------------------------------------------------------------- */

function askToken() {
  el.tokenInput.value = token;
  el.dialog.showModal();
  el.tokenInput.focus();
  el.tokenInput.select();
}

el.dialog.addEventListener("close", () => {
  if (el.dialog.returnValue !== "ok") return;
  token = el.tokenInput.value.trim().toUpperCase();
  localStorage.setItem(TOKEN_KEY, token);
  connect();       /* the stream carries the token in its URL, so re-open it */
});

$("tokenBtn").addEventListener("click", askToken);

/* --- stream ------------------------------------------------------------- */

let source = null;
let retryAt = 1000;

function connect() {
  if (source) { source.close(); source = null; }
  setStatus("wait", T.connecting);
  source = new EventSource(withToken("/api/stream"));

  source.addEventListener("open", () => {
    retryAt = 1000;
    setStatus("live", T.connected);
  });

  source.addEventListener("state", (event) => {
    setStatus("live", T.connected);
    try { render(JSON.parse(event.data)); } catch (_) { /* skip a bad frame */ }
  });

  source.addEventListener("bye", () => {
    /* The add-on is shutting the server down; stop hammering it. */
    source.close();
    source = null;
    setStatus("down", T.offline);
    setTimeout(connect, 5000);
  });

  source.addEventListener("error", () => {
    setStatus("down", T.offline);
    /* EventSource retries on its own, but a 401 closes it for good: check
       whether the server is asking for a token before giving up on it. */
    if (source && source.readyState === EventSource.CLOSED) {
      source = null;
      fetch(withToken("/api/state")).then((response) => {
        if (response.status === 401) { toast(T.token_bad, true); askToken(); return; }
        setTimeout(connect, retryAt);
        retryAt = Math.min(retryAt * 2, 15000);
      }).catch(() => {
        setTimeout(connect, retryAt);
        retryAt = Math.min(retryAt * 2, 15000);
      });
    }
  });
}

/* --- render ------------------------------------------------------------- */

function render(next) {
  state = next;
  control = !!next.control;

  if (!next.playing) {
    el.nowCard.classList.add("hidden");
    el.idleCard.classList.remove("hidden");
    for (const id of ["tiles", "chartCard", "frameCard", "vs10Card", "metaCard"]) {
      $(id).classList.add("hidden");
    }
    el.groups.innerHTML = "";
    rowNodes.clear();
    groupNodes.clear();
    history = [];
    return;
  }

  el.nowCard.classList.remove("hidden");
  el.idleCard.classList.add("hidden");

  renderNow(next);
  renderTiles(next.metrics || {});
  renderChart(next.metrics || {});
  renderFrame(next.metrics || {});
  renderVs10(next.vs10 || {});
  renderGroups(next.groups || []);
  renderMetadata(next.metadata);
}

function renderNow(snapshot) {
  el.title.textContent = snapshot.title || "—";
  if (snapshot.filename) {
    el.file.textContent = snapshot.filename;
    el.file.classList.remove("hidden");
  } else {
    el.file.classList.add("hidden");
  }

  /* An empty source type is SDR, not "unknown": the add-on publishes a token
     only for the HDR formats (see publish_hdr_type), which is the same thing
     the VS10 buttons branch on. */
  const badges = [{ text: prettyHdr(snapshot.hdr_type || "sdr"), alt: false }];
  if (snapshot.effective && snapshot.effective !== snapshot.hdr_type) {
    badges.push({ text: "→ " + prettyHdr(snapshot.effective), alt: true });
  }
  if (snapshot.paused) badges.push({ text: "❚❚", alt: true });
  el.badges.innerHTML = "";
  for (const badge of badges) {
    const node = document.createElement("span");
    node.className = badge.alt ? "badge alt" : "badge";
    node.textContent = badge.text;
    el.badges.appendChild(node);
  }

  const progress = (snapshot.metrics || {}).progress;
  el.bar.style.width = (progress === null || progress === undefined ? 0 : progress) + "%";
  el.tElapsed.textContent = snapshot.time || "--:--";
  el.tTotal.textContent = snapshot.duration || "--:--";
}

function prettyHdr(value) {
  /* The add-on publishes these as boolean-parser-safe tokens (hdr10plus for
     HDR10+, dolbyvision for Dolby Vision); print them the way they are written
     everywhere else. */
  const map = {
    sdr: "SDR", hdr10: "HDR10", hdr10plus: "HDR10+", hlg: "HLG",
    dolbyvision: "Dolby Vision"
  };
  const key = String(value).toLowerCase().replace(/[^a-z0-9+]/g, "");
  return map[key] || value;
}

function renderTiles(metrics) {
  el.tiles.classList.remove("hidden");
  const l1 = metrics.l1 || {};
  /* Peak and average come from the Dolby Vision L1 block and from nowhere
     else, so on any other source the two tiles are left out entirely rather
     than shown holding a dash. */
  const hasL1 = l1.max !== null && l1.max !== undefined;
  el.tPeak.classList.toggle("hidden", !hasL1);
  el.tAvg.classList.toggle("hidden", !hasL1);
  el.vPeak.textContent = fmtNits(l1.max);
  el.vAvg.textContent  = fmtNits(l1.avg);
  el.vAr.textContent   = metrics.aspect ? metrics.aspect.toFixed(2) + ":1" : "—";
  el.vFps.textContent  = metrics.fps_in ? metrics.fps_in.toFixed(3).replace(/0+$/, "").replace(/\.$/, "") : "—";
  el.uFps.textContent  = metrics.fps_drop ? "▼ " + metrics.fps_drop : " ";
}

/* --- chart -------------------------------------------------------------- */

/* Luminance spans four decades, from a black frame to a specular highlight,
   so the y axis is logarithmic: a linear one would flatten everything below
   a hundred nits into the baseline. */
const MIN_NITS = 0.01;
const MAX_NITS = 10000;
const logScale = (value) => {
  const clamped = Math.min(MAX_NITS, Math.max(MIN_NITS, value));
  return (Math.log10(clamped) - Math.log10(MIN_NITS)) /
         (Math.log10(MAX_NITS) - Math.log10(MIN_NITS));
};

function renderChart(metrics) {
  const l1 = metrics.l1 || {};
  if (l1.max === null || l1.max === undefined) {
    el.chartCard.classList.add("hidden");
    return;
  }
  el.chartCard.classList.remove("hidden");

  const now = Date.now() / 1000;
  history.push({ t: now, min: l1.min || 0, max: l1.max || 0, avg: l1.avg || 0 });
  while (history.length && now - history[0].t > HISTORY_SECONDS) history.shift();

  drawChart();
}

function drawChart() {
  const canvas = el.chart;
  const ratio = window.devicePixelRatio || 1;
  const width = canvas.clientWidth;
  const height = canvas.clientHeight;
  if (!width || !height) return;
  if (canvas.width !== Math.round(width * ratio) ||
      canvas.height !== Math.round(height * ratio)) {
    canvas.width = Math.round(width * ratio);
    canvas.height = Math.round(height * ratio);
  }

  const ctx = canvas.getContext("2d");
  ctx.setTransform(ratio, 0, 0, ratio, 0, 0);
  ctx.clearRect(0, 0, width, height);

  const style = getComputedStyle(document.documentElement);
  const accent = style.getPropertyValue("--accent").trim() || "#4fc3f7";
  const line   = style.getPropertyValue("--line").trim() || "#242c36";
  const accent2 = style.getPropertyValue("--accent-2").trim() || "#82b1ff";
  const dim    = style.getPropertyValue("--dim").trim() || "#5d6875";

  const padLeft = 34, padRight = 6, padTop = 8, padBottom = 6;
  const plotW = width - padLeft - padRight;
  const plotH = height - padTop - padBottom;
  const y = (nits) => padTop + plotH * (1 - logScale(nits));

  /* Gridlines, one per decade. */
  ctx.strokeStyle = line;
  ctx.fillStyle = dim;
  ctx.lineWidth = 1;
  ctx.font = "10px ui-monospace, monospace";
  ctx.textAlign = "right";
  ctx.textBaseline = "middle";
  for (const tick of [0.1, 1, 10, 100, 1000, 10000]) {
    const ty = Math.round(y(tick)) + 0.5;
    ctx.beginPath();
    ctx.moveTo(padLeft, ty);
    ctx.lineTo(width - padRight, ty);
    ctx.stroke();
    ctx.fillText(tick >= 1000 ? (tick / 1000) + "k" : String(tick), padLeft - 6, ty);
  }

  if (history.length < 2) return;

  const now = Date.now() / 1000;
  const x = (t) => padLeft + plotW * (1 - Math.min(1, (now - t) / HISTORY_SECONDS));

  /* Peak, as an area down to the floor.  The min of an L1 block sits near
     zero on almost every frame, so a min-max band would be full height and
     say nothing; the peak against the average is where the grade shows. */
  ctx.beginPath();
  ctx.moveTo(x(history[0].t), padTop + plotH);
  for (const point of history) ctx.lineTo(x(point.t), y(point.max));
  ctx.lineTo(x(history[history.length - 1].t), padTop + plotH);
  ctx.closePath();
  const fill = ctx.createLinearGradient(0, padTop, 0, padTop + plotH);
  fill.addColorStop(0, accent);
  fill.addColorStop(1, "transparent");
  ctx.globalAlpha = 0.28;
  ctx.fillStyle = fill;
  ctx.fill();
  ctx.globalAlpha = 1;

  const trace = (key, color, width, dash) => {
    ctx.setLineDash(dash || []);
    ctx.beginPath();
    history.forEach((point, index) => {
      const px = x(point.t), py = y(point[key]);
      index === 0 ? ctx.moveTo(px, py) : ctx.lineTo(px, py);
    });
    ctx.strokeStyle = color;
    ctx.lineWidth = width;
    ctx.lineJoin = "round";
    ctx.stroke();
    ctx.setLineDash([]);
  };

  /* The peak is the solid line the fill belongs to; the average is dashed, so
     the two never read as one band even where they run close together. */
  trace("max", accent, 1.7);
  trace("avg", accent2, 1.5, [4, 3]);
}

let resizeTimer = 0;
window.addEventListener("resize", () => {
  clearTimeout(resizeTimer);
  resizeTimer = setTimeout(drawChart, 120);
});

/* --- active picture ----------------------------------------------------- */

function renderFrame(metrics) {
  const bars = metrics.bars, frame = metrics.frame;
  if (!bars || !frame || !frame.w || !frame.h) {
    el.frameCard.classList.add("hidden");
    return;
  }
  el.frameCard.classList.remove("hidden");
  const [left, right, top, bottom] = bars;
  const box = el.frameActive.parentElement;
  box.style.aspectRatio = frame.w + " / " + frame.h;
  el.frameActive.style.inset =
    (top / frame.h * 100) + "% " + (right / frame.w * 100) + "% " +
    (bottom / frame.h * 100) + "% " + (left / frame.w * 100) + "%";
  el.frameNote.textContent =
    frame.w + "×" + frame.h + "   L " + left + "  R " + right +
    "  T " + top + "  B " + bottom;
}

/* --- VS10 --------------------------------------------------------------- */

function renderVs10(vs10) {
  const options = vs10.options || [];
  if (!control || !options.length) {
    el.vs10Card.classList.add("hidden");
    return;
  }
  el.vs10Card.classList.remove("hidden");
  el.vs10Out.textContent = vs10.output || "—";

  const signature = options.map((option) => option.mode).join("|");
  if (el.modes.dataset.signature !== signature) {
    el.modes.dataset.signature = signature;
    el.modes.innerHTML = "";
    for (const option of options) {
      const button = document.createElement("button");
      button.type = "button";
      button.className = "mode";
      button.dataset.mode = option.mode;
      button.textContent = option.label;
      button.addEventListener("click", () => switchMode(option.mode, button));
      el.modes.appendChild(button);
    }
  }
}

async function switchMode(mode, button) {
  if (pending) return;
  pending = mode;
  for (const node of el.modes.children) node.disabled = true;
  button.classList.add("busy");
  toast(T.switching);
  try {
    const response = await fetch("/api/mode", {
      method: "POST",
      headers: { "Content-Type": "application/json", "X-TinyPPI-Token": token },
      body: JSON.stringify({ mode })
    });
    if (response.status === 401) {
      toast(T.token_bad, true);
      askToken();
    } else if (!response.ok) {
      toast(T.switch_failed, true);
    } else {
      toast(T.switched);
    }
  } catch (_) {
    toast(T.switch_failed, true);
  } finally {
    /* The driver needs a moment to settle before the next snapshot shows the
       new output; keep the buttons locked until then rather than inviting a
       second press into the middle of the switch. */
    setTimeout(() => {
      pending = null;
      button.classList.remove("busy");
      for (const node of el.modes.children) node.disabled = false;
    }, 1200);
  }
}

/* --- detail groups ------------------------------------------------------ */

function renderGroups(groups) {
  const seen = new Set();

  for (const group of groups) {
    seen.add(group.id);
    let card = groupNodes.get(group.id);
    if (!card) {
      card = document.createElement("section");
      card.className = "card";
      const heading = document.createElement("h2");
      heading.textContent = group.title;
      const rows = document.createElement("div");
      rows.className = "rows";
      card.append(heading, rows);
      card.dataset.group = group.id;
      groupNodes.set(group.id, card);
      el.groups.appendChild(card);
    }
    renderRows(card.querySelector(".rows"), group);
  }

  for (const [id, card] of groupNodes) {
    if (!seen.has(id)) { card.remove(); groupNodes.delete(id); }
  }
}

function renderRows(container, group) {
  const wanted = group.rows.map((row) => row.id);
  const seen = new Set(wanted);

  group.rows.forEach((row, index) => {
    let node = rowNodes.get(row.id);
    if (!node) {
      const element = document.createElement("div");
      element.className = "row";
      const key = document.createElement("span");
      key.className = "k";
      const value = document.createElement("span");
      value.className = "v mono";
      element.append(key, value);
      node = { element, key, value, last: null, timer: 0 };
      rowNodes.set(row.id, node);
    }
    /* Keep the DOM in the order the snapshot names, so a row that appears
       mid-title lands where it belongs instead of at the end. */
    const at = container.children[index];
    if (at !== node.element) container.insertBefore(node.element, at || null);

    node.key.textContent = row.label;
    const text = row.detail ? row.value + "  " : row.value;
    if (node.last !== row.value + "\n" + row.detail) {
      if (node.last !== null) flash(node);
      node.last = row.value + "\n" + row.detail;
      node.value.textContent = text;
      if (row.detail) {
        const detail = document.createElement("span");
        detail.className = "d";
        detail.textContent = row.detail;
        node.value.append(detail);
      }
    }
  });

  for (const [id, node] of rowNodes) {
    if (id.startsWith(group.id + ".") && !seen.has(id)) {
      node.element.remove();
      rowNodes.delete(id);
    }
  }
}

/* Mirrors the overlay's own highlight: a reading that moved is written in the
   change color and fades back, so the live values stand out from the fixed
   ones without slowing the refresh down. */
function flash(node) {
  node.element.classList.add("changed");
  clearTimeout(node.timer);
  node.timer = setTimeout(() => node.element.classList.remove("changed"), 750);
}

/* --- Dolby Vision metadata view ----------------------------------------- */

/* The rows arrive as (kind, name, value) exactly as info.dvmetadata builds
   them for the on-screen view, so what is listed here is what the bitstream
   said -- nothing is picked out or interpreted on the way. */

const META_OPEN_KEY = "tinyppi.meta.open";
let metaSignature = "";
let live = [];   /* {node, index, field} for every reading that moves */

function renderMetadata(rows) {
  if (!rows || !rows.length) {
    el.metaCard.classList.add("hidden");
    metaSignature = "";
    live = [];
    return;
  }
  el.metaCard.classList.remove("hidden");
  el.metaCount.textContent = rows.filter((r) => r.kind !== "space").length;

  /* Rebuilding a hundred-odd nodes five times a second would fight the
     browser for no gain, and the list only changes shape when a block comes
     or goes.  So the values are written in place and the nodes are rebuilt
     only when the shape itself moves. */
  const signature = rows.map((r) => r.kind + "\u001f" + r.name).join("\u001e");
  if (signature !== metaSignature) {
    metaSignature = signature;
    buildMetadata(rows);
    return;
  }
  updateMetadata(rows);
}

function buildMetadata(rows) {
  const frag = document.createDocumentFragment();
  el.metaRows.textContent = "";
  live = [];

  /* Each section and its rows go in a block of their own, so the two-column
     layout on a wide screen breaks between sections and never through one. */
  let block = null;
  const open = () => {
    block = document.createElement("div");
    block.className = "mblock";
    frag.append(block);
    return block;
  };

  rows.forEach((row, index) => {
    if (row.kind === "space") return;          /* the blocks space themselves */
    if (row.kind === "section" || !block) open();

    let node;
    if (row.kind === "section") {
      node = document.createElement("div");
      node.className = "msection";
      const name = document.createElement("span");
      name.textContent = row.name;
      node.append(name);
      /* A held block says so on its heading -- see info.dvmetadata._state. */
      const state = document.createElement("span");
      state.className = "state";
      state.textContent = row.value || "";
      node.append(state);
      live.push({ node: state, index, field: "value" });
    } else if (row.kind === "wide") {
      node = document.createElement("div");
      node.className = "mwide mono";
      node.textContent = row.value;
      live.push({ node, index, field: "value" });
    } else if (row.kind === "headings" || row.kind === "columns") {
      node = document.createElement("div");
      node.className = "mtable" + (row.kind === "headings" ? " mhead" : " mono");
      const line = document.createElement("div");
      const lead = document.createElement("span");
      lead.className = "lead";
      lead.textContent = row.name;
      line.append(lead);
      for (const cell of row.cells || []) {
        const span = document.createElement("span");
        span.textContent = cell;
        line.append(span);
      }
      node.append(line);
      live.push({ node: line, index, field: "cells" });
    } else {
      node = document.createElement("div");
      node.className = "mrow";
      const key = document.createElement("span");
      key.className = "k";
      key.textContent = row.name;
      const value = document.createElement("span");
      value.className = "v mono";
      value.textContent = row.value;
      node.append(key, value);
      live.push({ node: value, index, field: "value" });
    }
    block.append(node);
  });

  el.metaRows.append(frag);
}

/* Where each live reading landed, so a tick writes the values straight into
   the nodes that hold them instead of walking the tree for them. */
function updateMetadata(rows) {
  for (const entry of live) {
    const row = rows[entry.index];
    if (!row) continue;
    if (entry.field === "cells") {
      const cells = entry.node.children;
      (row.cells || []).forEach((cell, index) => {
        const span = cells[index + 1];
        if (span && span.textContent !== cell) span.textContent = cell;
      });
    } else {
      const text = row.value || "";
      if (entry.node.textContent !== text) entry.node.textContent = text;
    }
  }
}

el.metaCard.addEventListener("toggle", () => {
  localStorage.setItem(META_OPEN_KEY, el.metaCard.open ? "1" : "0");
});

/* --- report ------------------------------------------------------------- */

function buildReport() {
  if (!state || !state.playing) return "";
  const lines = ["TinyPPI"];
  if (state.title) lines.push(state.title);
  if (state.filename) lines.push(state.filename);
  lines.push("");
  for (const group of state.groups || []) {
    lines.push("[" + group.title + "]");
    const width = Math.max(...group.rows.map((row) => row.label.length));
    for (const row of group.rows) {
      const detail = row.detail ? "  (" + row.detail + ")" : "";
      lines.push("  " + row.label.padEnd(width) + "  " + row.value + detail);
    }
    lines.push("");
  }
  for (const row of state.metadata || []) {
    if (row.kind === "space") lines.push("");
    else if (row.kind === "section") lines.push("[" + row.name + (row.value ? " - " + row.value : "") + "]");
    else if (row.kind === "wide") lines.push("  " + row.value);
    else if (row.cells) lines.push("  " + row.name.padEnd(26) + row.cells.join("  "));
    else lines.push("  " + row.name.padEnd(26) + row.value);
  }
  return lines.join("\n");
}

el.copyBtn.addEventListener("click", async () => {
  const report = buildReport();
  if (!report) return;
  try {
    await navigator.clipboard.writeText(report);
    toast(T.copied);
  } catch (_) {
    /* Clipboard access needs a secure context, which plain http on a LAN is
       not; hand the report over as a file instead of failing silently. */
    const url = URL.createObjectURL(new Blob([report], { type: "text/plain" }));
    const link = document.createElement("a");
    link.href = url;
    link.download = "tinyppi.txt";
    link.click();
    URL.revokeObjectURL(url);
  }
});

/* --- wake lock ---------------------------------------------------------- */

let wakeLock = null;
if ("wakeLock" in navigator) {
  el.wakeBtn.classList.remove("hidden");
  el.wakeBtn.addEventListener("click", async () => {
    if (wakeLock) {
      await wakeLock.release().catch(() => {});
      wakeLock = null;
      el.wakeBtn.setAttribute("aria-pressed", "false");
      return;
    }
    try {
      wakeLock = await navigator.wakeLock.request("screen");
      wakeLock.addEventListener("release", () => {
        wakeLock = null;
        el.wakeBtn.setAttribute("aria-pressed", "false");
      });
      el.wakeBtn.setAttribute("aria-pressed", "true");
    } catch (_) { /* denied; the button simply stays off */ }
  });
  document.addEventListener("visibilitychange", async () => {
    if (document.visibilityState === "visible" &&
        el.wakeBtn.getAttribute("aria-pressed") === "true" && !wakeLock) {
      try { wakeLock = await navigator.wakeLock.request("screen"); } catch (_) {}
    }
  });
}

/* --- boot --------------------------------------------------------------- */

function applyStrings(strings) {
  T = Object.assign(T, strings || {});
  document.title = "TinyPPI";
  $("idleTitle").textContent = T.idle_title;
  $("idleText").textContent = T.idle_text;
  $("kPeak").textContent = T.peak;
  $("kAvg").textContent = T.average;
  $("kAr").textContent = T.aspect;
  $("kFps").textContent = T.fps;
  $("chartTitle").textContent = T.chart;
  $("chartScale").textContent = "nits · log";
  $("frameTitle").textContent = T.active_area;
  $("vs10Title").textContent = T.vs10;
  $("metaTitle").textContent = T.metadata;
  $("vs10OutLabel").textContent = T.output;
  $("dlgTitle").textContent = T.token_title;
  $("dlgText").textContent = T.token_text;
  $("dlgOk").textContent = T.save;
  $("dlgCancel").textContent = T.cancel;
  el.copyBtn.textContent = T.copy;
  el.wakeBtn.querySelector(".lbl").textContent = T.awake;
  el.wakeBtn.setAttribute("aria-label", T.awake);
  el.wakeBtn.title = T.awake;
}

async function boot() {
  applyStrings({});
  el.metaCard.open = localStorage.getItem(META_OPEN_KEY) !== "0";
  try {
    const hello = await (await fetch("/api/hello")).json();
    el.version.textContent = "v" + hello.version;
    el.foot.textContent = "TinyPPI " + hello.version;
    applyStrings(hello.strings);
    if (hello.auth_read && !token) { askToken(); return; }
  } catch (_) { /* the stream's own retry will report the outage */ }
  connect();
}

boot();
</script>

<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#090b0f">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="robots" content="noindex, nofollow">
<!-- Loaded here, ahead of everything it could flash against: it puts
     the chosen theme on <html> before the page is first painted. -->
<script src="/js/theme.js"></script>
<title>TinyPPI</title>
<link rel="manifest" href="/manifest.webmanifest">
<link rel="apple-touch-icon" href="/icon.png">
<link rel="icon" href="/icon.png">
<link rel="stylesheet" href="/css/base.css">
<link rel="stylesheet" href="/css/live-panels.css">
<link rel="stylesheet" href="/css/dashboard.css">
<link rel="stylesheet" href="/css/metadata.css">
<link rel="stylesheet" href="/css/theme.css">
</head>

<body class="dashboard-page">

<header class="topbar">
  <div class="brand">
    <img class="brandmark" src="/icon.png" alt="">
    <b>TinyPPI</b><span class="ver" id="version"></span>
  </div>
  <div class="action-menu" id="actionMenu">
    <button class="iconbtn" id="actionMenuToggle" type="button"
            title="Menu" aria-label="Menu" aria-controls="actionMenuItems"
            aria-expanded="false">
      <span class="hamburger" aria-hidden="true"></span>
    </button>
    <div class="action-menu-items" id="actionMenuItems" aria-hidden="true" inert>
      <button class="iconbtn hidden" id="copyBtn" type="button">
        <span class="ui-icon painted" style="--icon: url('/icons/download.svg')"></span>
      </button>
      <button class="iconbtn" id="tokenBtn" type="button" title="Token" aria-label="Token">
        <span class="ui-icon painted" style="--icon: url('/icons/key.svg')"></span>
      </button>
    </div>
  </div>
  <div class="status" id="status" data-state="wait" role="status" aria-live="polite">
    <span class="dot"></span><span id="statusText">…</span>
  </div>
</header>

<main>

  <!-- One page, five tabs, the same five the TinyPPI app puts in its floating
       bar: what is playing, the Dolby Vision metadata, the two shelves and
       the history.  Each tab is a panel of its own and only the chosen one is
       laid out (see the tabs in js/dashboard.js); the connection underneath
       is the one stream whichever of them is in front. -->

  <!-- What is playing, what can be done to it, and every reading the overlay
       carries. -->
  <section class="tabpanel" id="tab-live" data-tab="live" role="tabpanel"
           aria-labelledby="tabbtn-live">
    <div class="rail rail-main">
      <div id="live"></div>

      <details class="card hidden" id="vs10Card">
        <summary class="panel-toggle"><span id="vs10Title"></span></summary>
        <div class="vs10">
          <div class="out"><span id="vs10OutLabel"></span><b id="vs10Out">—</b></div>
          <div class="modes" id="modes"></div>
        </div>
      </details>
    </div>

    <!-- Every reading the overlay carries, as many cards to a row as fit. -->
    <div class="groups" id="groups"></div>

    <section class="card idlecard hidden" id="idleCard">
      <div class="empty">
        <div class="big" id="idleTitle">—</div>
        <p id="idleText"></p>
      </div>
    </section>
  </section>

  <!-- The Dolby Vision metadata: the active picture, the L1 luminance chart
       (moved in here from #live by js/dashboard.js) and the whole list. -->
  <section class="tabpanel" id="tab-metadata" data-tab="metadata" role="tabpanel"
           aria-labelledby="tabbtn-metadata">
    <details class="card hidden" id="frameCard">
      <summary class="panel-toggle"><span id="frameTitle"></span></summary>
      <div class="framewrap">
        <div class="frame"><i id="frameActive"></i></div>
        <div class="framenote mono" id="frameNote"></div>
      </div>
    </details>

    <details class="card hidden" id="listCard">
      <summary class="panel-toggle"><span id="metadataTitle"></span></summary>
      <div class="metarows" id="metaRows"></div>
    </details>

    <section class="card idlecard hidden" id="metaIdleCard">
      <div class="empty">
        <div class="big" id="metaIdleTitle">—</div>
        <p id="metaIdleText"></p>
      </div>
    </section>
  </section>

  <!-- The films the video database holds: what was left half-watched, what
       has not been seen yet, and the wall of all of them.  A press on a
       poster asks what is wanted of it (see "what a press asks" in
       js/dashboard.js). -->
  <section class="tabpanel" id="tab-films" data-tab="films" role="tabpanel"
           aria-labelledby="tabbtn-films">
    <details class="card hidden" id="continueFilmsCard">
      <summary class="panel-toggle">
        <span id="continueFilmsLabel"></span>
        <span class="filmscount mono" id="continueFilmsCount"></span>
      </summary>
      <div class="filmsbody">
        <div class="continuerow" id="continueFilmsRow"></div>
      </div>
    </details>

    <details class="card hidden" id="unseenFilmsCard">
      <summary class="panel-toggle">
        <span id="unseenFilmsLabel"></span>
        <span class="filmscount mono" id="unseenFilmsCount"></span>
      </summary>
      <div class="filmsbody">
        <div class="filmgrid" id="unseenFilmGrid"></div>
      </div>
    </details>

    <details class="card hidden" id="filmsCard">
      <summary class="panel-toggle">
        <span id="filmsLabel"></span>
        <span class="filmscount mono" id="filmsCount"></span>
      </summary>
      <div class="filmsbody">
        <div class="searchbox" id="filmSearchBox">
          <input class="filmsearch" id="filmSearch" type="search" autocomplete="off"
                 spellcheck="false" aria-labelledby="filmsLabel">
          <button class="searchclear hidden" id="filmSearchClear" type="button"></button>
        </div>
        <div class="filmgrid" id="filmGrid"></div>
        <p class="filmsempty hidden" id="filmsEmpty"></p>
      </div>
    </details>
  </section>

  <!-- And the series: the same three cards, except that a series is not a
       thing that can be played -- a press opens the show, the wall gives way
       to its episodes, and a press on one of those starts it. -->
  <section class="tabpanel" id="tab-series" data-tab="series" role="tabpanel"
           aria-labelledby="tabbtn-series">
    <details class="card hidden" id="continueSeriesCard">
      <summary class="panel-toggle">
        <span id="continueSeriesLabel"></span>
        <span class="filmscount mono" id="continueSeriesCount"></span>
      </summary>
      <div class="filmsbody">
        <div class="continuerow" id="continueSeriesRow"></div>
      </div>
    </details>

    <details class="card hidden" id="unseenSeriesCard">
      <summary class="panel-toggle">
        <span id="unseenSeriesLabel"></span>
        <span class="filmscount mono" id="unseenSeriesCount"></span>
      </summary>
      <div class="filmsbody">
        <div class="filmgrid" id="unseenSeriesGrid"></div>
      </div>
    </details>

    <details class="card hidden" id="seriesCard">
      <summary class="panel-toggle">
        <span id="seriesLabel"></span>
        <span class="filmscount mono" id="seriesCount"></span>
      </summary>
      <div class="filmsbody">
        <button class="seriesback hidden" id="seriesBack" type="button">
          <span aria-hidden="true">&#8249;</span><span id="seriesBackText"></span>
        </button>
        <h3 class="seriesopen hidden" id="seriesOpen"></h3>
        <div class="searchbox" id="seriesSearchBox">
          <input class="filmsearch" id="seriesSearch" type="search" autocomplete="off"
                 spellcheck="false" aria-labelledby="seriesLabel">
          <button class="searchclear hidden" id="seriesSearchClear" type="button"></button>
        </div>
        <div class="filmgrid" id="seriesGrid"></div>
        <div class="episodes hidden" id="episodeList"></div>
        <p class="filmsempty hidden" id="seriesEmpty"></p>
      </div>
    </details>
  </section>

  <!-- What the playing of it has come to: the figures and the events along
       the way (the events card is moved in here from #live), and -- once it
       has ended -- what the title that just finished added up to. -->
  <section class="tabpanel" id="tab-history" data-tab="history" role="tabpanel"
           aria-labelledby="tabbtn-history">
    <!-- The add-on keeps a session for a while after the player stops, which
         is when its figures are worth reading (see SessionLog.end in
         web/snapshot.py). -->
    <section class="card hidden" id="lastCard">
      <div class="lasthead">
        <span class="k" id="lastLabel"></span>
        <b id="lastTitle"></b>
      </div>
      <div class="tilegrid" id="lastTiles"></div>
    </section>

    <section class="card idlecard hidden" id="historyIdleCard">
      <div class="empty">
        <div class="big" id="historyIdleTitle">—</div>
        <p id="historyIdleText"></p>
      </div>
    </section>
  </section>

</main>

<!-- The floating bar the tabs are switched with, the same five places in the
     same order as the app's.  Over the page rather than under it: the panels
     leave room at their foot for it (see .tabbar in css/base.css). -->
<nav class="tabbar" id="tabBar" role="tablist" aria-label="TinyPPI">
  <button class="tab" id="tabbtn-live" type="button" role="tab" data-tab="live"
          aria-controls="tab-live">
    <span class="tabicon"><span class="ui-icon painted" style="--icon: url('/icons/tab-live.svg')"></span></span>
    <span class="tablabel" id="tabLiveLabel">Live</span>
  </button>
  <button class="tab" id="tabbtn-metadata" type="button" role="tab" data-tab="metadata"
          aria-controls="tab-metadata">
    <span class="tabicon"><span class="ui-icon painted" style="--icon: url('/icons/tab-metadata.svg')"></span></span>
    <span class="tablabel" id="tabMetadataLabel">Metadata</span>
  </button>
  <button class="tab" id="tabbtn-films" type="button" role="tab" data-tab="films"
          aria-controls="tab-films">
    <span class="tabicon"><span class="ui-icon painted" style="--icon: url('/icons/tab-films.svg')"></span></span>
    <span class="tablabel" id="tabFilmsLabel">Films</span>
  </button>
  <button class="tab" id="tabbtn-series" type="button" role="tab" data-tab="series"
          aria-controls="tab-series">
    <span class="tabicon"><span class="ui-icon painted" style="--icon: url('/icons/tab-series.svg')"></span></span>
    <span class="tablabel" id="tabSeriesLabel">Series</span>
  </button>
  <button class="tab" id="tabbtn-history" type="button" role="tab" data-tab="history"
          aria-controls="tab-history">
    <span class="tabicon"><span class="ui-icon painted" style="--icon: url('/icons/tab-history.svg')"></span></span>
    <span class="tablabel" id="tabHistoryLabel">History</span>
  </button>
</nav>

<!-- What a press on a poster or an episode asks: play it (open it, for a
     series), or have the box count it as seen or as unseen (see "what a press
     asks" in js/dashboard.js). -->
<dialog id="markDialog"><form method="dialog">
  <h3 id="markTitle"></h3>
  <div class="markoptions">
    <button value="play" id="markPlay" type="submit"></button>
    <button value="restart" id="markRestart" type="submit" hidden></button>
    <button value="watched" id="markWatched" type="submit"></button>
    <button value="unwatched" id="markUnwatched" type="submit"></button>
    <button value="clear" id="markClear" type="submit" hidden></button>
  </div>
  <div class="dlgrow"><button value="cancel" id="markCancel" type="submit"></button></div>
</form></dialog>

<script src="/js/core.js"></script>
<script src="/js/cover-tint.js"></script>
<script src="/js/live-panels.js"></script>
<script src="/js/metadata.js"></script>
<script src="/js/dashboard.js"></script>
</body>
</html>

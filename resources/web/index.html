<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#090b0f">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="robots" content="noindex, nofollow">
<!-- Loaded here, ahead of everything it could flash against: it puts
     the chosen theme on <html> before the page is first painted. -->
<script src="/js/theme.js"></script>
<title>TinyPPI</title>
<link rel="manifest" href="/manifest.webmanifest">
<link rel="apple-touch-icon" href="/icon.png">
<link rel="icon" href="/icon.png">
<link rel="stylesheet" href="/css/base.css">
<link rel="stylesheet" href="/css/live-panels.css">
<link rel="stylesheet" href="/css/dashboard.css">
<link rel="stylesheet" href="/css/theme.css">
</head>

<body class="dashboard-page">

<header class="topbar">
  <div class="brand">
    <img class="brandmark" src="/icon.png" alt="">
    <b>TinyPPI</b><span class="ver" id="version"></span>
  </div>
  <div class="action-menu" id="actionMenu">
    <button class="iconbtn" id="actionMenuToggle" type="button"
            title="Menu" aria-label="Menu" aria-controls="actionMenuItems"
            aria-expanded="false">
      <span class="hamburger" aria-hidden="true"></span>
    </button>
    <div class="action-menu-items" id="actionMenuItems" aria-hidden="true" inert>
      <button class="iconbtn hidden" id="copyBtn" type="button">
        <span class="ui-icon painted" style="--icon: url('/icons/download.svg')"></span>
      </button>
      <button class="iconbtn" id="tokenBtn" type="button" title="Token" aria-label="Token">
        <span class="ui-icon painted" style="--icon: url('/icons/key.svg')"></span>
      </button>
    </div>
  </div>
  <div class="status" id="status" data-state="wait" role="status" aria-live="polite">
    <span class="dot"></span><span id="statusText">…</span>
  </div>
</header>

<main>

  <!-- What is playing, and the one control that belongs beside it.  On a wide
       screen this is the left of the two columns; on a narrow one it is simply
       the top of the page (see .rail in base.css). -->
  <div class="rail rail-main">
    <div id="live"></div>

    <details class="card hidden" id="vs10Card">
      <summary class="panel-toggle"><span id="vs10Title"></span></summary>
      <div class="vs10">
        <div class="out"><span id="vs10OutLabel"></span><b id="vs10Out">—</b></div>
        <div class="modes" id="modes"></div>
      </div>
    </details>
  </div>

  <!-- What the playing of it has come to: the figures, the chart of them and
       the events along the way.  Ahead of the detail groups in the markup, so
       a narrow screen reads it straight after the playback card and the VS10
       output above it rather than below every group on the page; the desktop
       layout names its own areas and is unaffected (see base.css). -->
  <div class="rail rail-side" id="sideRail"></div>

  <!-- Every reading the overlay carries, as many cards to a row as fit.  In
       neither rail: this is the bulk of the page and all one kind of thing, so
       on a wide screen it runs the whole width under both of them. -->
  <div class="groups" id="groups"></div>

  <!-- The idle page, as one centred column: what is not playing, what was,
       and what happened while it was.  The events card is moved in here for
       as long as nothing plays and back out when something does (see
       js/dashboard.js).  It belongs to neither rail: with nothing playing
       both of those are empty and gone, and this stands across the page. -->
  <div class="idlestack" id="idleStack">
    <section class="card hidden" id="idleCard">
      <div class="empty">
        <div class="big" id="idleTitle">—</div>
        <p id="idleText"></p>
      </div>
    </section>

    <!-- What the title that has just finished came to.  The add-on keeps a
         session for a while after the player stops, which is when its figures
         are worth reading (see SessionLog.end in web/snapshot.py). -->
    <section class="card hidden" id="lastCard">
      <div class="lasthead">
        <span class="k" id="lastLabel"></span>
        <b id="lastTitle"></b>
      </div>
      <div class="tilegrid" id="lastTiles"></div>
    </section>

    <!-- The quickest way back into what was on: the films and episodes the box
         was stopped in the middle of, the last one seen first, on one row that
         scrolls sideways (see continue watching in js/dashboard.js).

         Above both shelves and travelling with them, and open to begin with
         where they arrive folded: it is a row of a handful of posters rather
         than a wall of hundreds, and it is only on the page at all when there
         is something on it. -->
    <details class="card hidden" id="continueCard">
      <summary class="panel-toggle">
        <span id="continueLabel"></span>
        <span class="filmscount mono" id="continueCount"></span>
      </summary>
      <div class="filmsbody">
        <div class="continuerow" id="continueRow"></div>
      </div>
    </details>

    <!-- What could be playing instead: the films the video database holds, as
         posters.  A press starts one (see the film library in
         js/dashboard.js).

         On the page whether or not anything is playing: on a box at its home
         screen the wall is the page, and while something plays it is what
         somebody who picked up the phone to line up the next thing came for.
         The card itself moves rather than being drawn twice -- here while
         nothing plays, and down into the library row under the readings while
         something does (see render in js/dashboard.js) -- so there is one
         wall on the page and one search box narrowing it.

         Last in the stack, and the events card is moved in above it rather
         than after it: the library is the one card here somebody scrolls
         through, and a card put under it is a card nobody reaches.  It
         arrives folded and remembers on each device whether it was left that
         way. -->
    <details class="card hidden" id="filmsCard">
      <summary class="panel-toggle">
        <span id="filmsLabel"></span>
        <span class="filmscount mono" id="filmsCount"></span>
      </summary>
      <div class="filmsbody">
        <div class="searchbox" id="filmSearchBox">
          <input class="filmsearch" id="filmSearch" type="search" autocomplete="off"
                 spellcheck="false" aria-labelledby="filmsLabel">
          <button class="searchclear hidden" id="filmSearchClear" type="button"></button>
        </div>
        <div class="filmgrid" id="filmGrid"></div>
        <p class="filmsempty hidden" id="filmsEmpty"></p>
      </div>
    </details>

    <!-- The films on that wall the box has not counted as seen, on a wall of
         their own under it: what is still waiting to be watched, without the
         hundreds that have been scrolled past on the way to it.  The same
         tiles as the wall above, and a press starts one the same way.  Read
         out of the same list rather than asked for again, and not on the page
         at all while there is nothing on it. -->
    <details class="card hidden" id="unseenFilmsCard">
      <summary class="panel-toggle">
        <span id="unseenFilmsLabel"></span>
        <span class="filmscount mono" id="unseenFilmsCount"></span>
      </summary>
      <div class="filmsbody">
        <div class="filmgrid" id="unseenFilmGrid"></div>
      </div>
    </details>

    <!-- And the series, on a shelf of their own under the films.  The same
         wall of posters, except that a series is not a thing that can be
         played: a press opens the show, the wall gives way to its episodes,
         and a press on one of those starts it (see the series library in
         js/dashboard.js).

         The way back out sits at the top of the card rather than under the
         list: a show with forty episodes in it is forty rows of scrolling
         away from a button underneath.

         It travels with the films, and arrives folded for the same reason. -->
    <details class="card hidden" id="seriesCard">
      <summary class="panel-toggle">
        <span id="seriesLabel"></span>
        <span class="filmscount mono" id="seriesCount"></span>
      </summary>
      <div class="filmsbody">
        <button class="seriesback hidden" id="seriesBack" type="button">
          <span aria-hidden="true">&#8249;</span><span id="seriesBackText"></span>
        </button>
        <h3 class="seriesopen hidden" id="seriesOpen"></h3>
        <div class="searchbox" id="seriesSearchBox">
          <input class="filmsearch" id="seriesSearch" type="search" autocomplete="off"
                 spellcheck="false" aria-labelledby="seriesLabel">
          <button class="searchclear hidden" id="seriesSearchClear" type="button"></button>
        </div>
        <div class="filmgrid" id="seriesGrid"></div>
        <div class="episodes hidden" id="episodeList"></div>
        <p class="filmsempty hidden" id="seriesEmpty"></p>
      </div>
    </details>

    <!-- And the series with an episode still waiting, under the wall of all
         of them.  A press opens the show in the card above, which is where its
         episodes are listed, and brings that card into view. -->
    <details class="card hidden" id="unseenSeriesCard">
      <summary class="panel-toggle">
        <span id="unseenSeriesLabel"></span>
        <span class="filmscount mono" id="unseenSeriesCount"></span>
      </summary>
      <div class="filmsbody">
        <div class="filmgrid" id="unseenSeriesGrid"></div>
      </div>
    </details>
  </div>

  <!-- Where the two shelves stand for as long as something is playing: empty
       the rest of the time, because the cards themselves are moved in and out
       of it (see render in js/dashboard.js).

       Under the last of the reading cards: what is on is what the page is for
       while it is on, and what to put on after it comes after it. -->
  <div class="librarystack" id="libraryStack"></div>

  <!-- A destination for the whole dashboard rather than the right rail: on a
       desktop it is the full-width final row, after every reading and event. -->
  <a class="metalink hidden" id="metaLink" href="/metadata" target="tinyppi-metadata"
     rel="noopener">
    <span class="dv">DV</span><span id="metaLinkText"></span><span class="arrow">↗</span>
  </a>

</main>

<!-- What a finger held on a poster or an episode asks: whether the box should
     count it as seen or as unseen (see marking in js/dashboard.js). -->
<dialog id="markDialog"><form method="dialog">
  <h3 id="markTitle"></h3>
  <div class="markoptions">
    <button value="watched" id="markWatched" type="submit"></button>
    <button value="unwatched" id="markUnwatched" type="submit"></button>
  </div>
  <div class="dlgrow"><button value="cancel" id="markCancel" type="submit"></button></div>
</form></dialog>

<script src="/js/core.js"></script>
<script src="/js/cover-tint.js"></script>
<script src="/js/live-panels.js"></script>
<script src="/js/dashboard.js"></script>
</body>
</html>

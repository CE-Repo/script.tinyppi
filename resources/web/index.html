<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#090b0f">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="robots" content="noindex, nofollow">
<!-- Loaded here, ahead of everything it could flash against: it puts
     the chosen theme on <html> before the page is first painted. -->
<script src="/js/theme.js"></script>
<title>TinyPPI</title>
<link rel="manifest" href="/manifest.webmanifest">
<link rel="apple-touch-icon" href="/icon.jpg">
<link rel="icon" href="/icon.jpg">
<link rel="stylesheet" href="/css/base.css">
<link rel="stylesheet" href="/css/live-panels.css">
<link rel="stylesheet" href="/css/dashboard.css">
<link rel="stylesheet" href="/css/theme.css">
</head>

<body class="dashboard-page">

<header class="topbar">
  <div class="brand">
    <img class="brandmark" src="/icon.jpg" alt="">
    <b>TinyPPI</b><span class="ver" id="version"></span>
  </div>
  <button class="iconbtn hidden" id="copyBtn" type="button">
    <span class="ui-icon painted" style="--icon: url('/icons/download.svg')"></span>
  </button>
  <button class="iconbtn" id="tokenBtn" type="button" title="Token" aria-label="Token">
    <span class="ui-icon painted" style="--icon: url('/icons/key.svg')"></span>
  </button>
  <div class="status" id="status" data-state="wait" role="status" aria-live="polite">
    <span class="dot"></span><span id="statusText">…</span>
  </div>
</header>

<main>

  <!-- What is playing, and the one control that belongs beside it.  On a wide
       screen this is the left of the two columns; on a narrow one it is simply
       the top of the page (see .rail in base.css). -->
  <div class="rail rail-main">
    <div id="live"></div>

    <details class="card hidden" id="vs10Card">
      <summary class="panel-toggle"><span id="vs10Title"></span></summary>
      <div class="vs10">
        <div class="out"><span id="vs10OutLabel"></span><b id="vs10Out">—</b></div>
        <div class="modes" id="modes"></div>
      </div>
    </details>
  </div>

  <!-- Every reading the overlay carries, as many cards to a row as fit.  In
       neither rail: this is the bulk of the page and all one kind of thing, so
       on a wide screen it runs the whole width under both of them. -->
  <div class="groups" id="groups"></div>

  <!-- The idle page, as one centred column: what is not playing, what was,
       and what happened while it was.  The events card is moved in here for
       as long as nothing plays and back out when something does (see
       js/dashboard.js).  It belongs to neither rail: with nothing playing
       both of those are empty and gone, and this stands across the page. -->
  <div class="idlestack" id="idleStack">
    <section class="card hidden" id="idleCard">
      <div class="empty">
        <div class="big" id="idleTitle">—</div>
        <p id="idleText"></p>
      </div>
    </section>

    <!-- What the title that has just finished came to.  The add-on keeps a
         session for a while after the player stops, which is when its figures
         are worth reading (see SessionLog.end in web/snapshot.py). -->
    <section class="card hidden" id="lastCard">
      <div class="lasthead">
        <span class="k" id="lastLabel"></span>
        <b id="lastTitle"></b>
      </div>
      <div class="tilegrid" id="lastTiles"></div>
    </section>
  </div>

  <!-- What the playing of it has come to: the figures, the chart of them, the
       events along the way, and the way through to the metadata window.  On a
       wide screen this is the right of the two columns.  js/dashboard.js moves
       the first three in here, each of them anchored to the link below --
       which is why the link is the one thing written out. -->
  <div class="rail rail-side">
    <a class="metalink hidden" id="metaLink" href="/metadata" target="tinyppi-metadata"
       rel="noopener">
      <span class="dv">DV</span><span id="metaLinkText"></span><span class="arrow">↗</span>
    </a>
  </div>

</main>

<script src="/js/core.js"></script>
<script src="/js/cover-tint.js"></script>
<script src="/js/live-panels.js"></script>
<script src="/js/dashboard.js"></script>
</body>
</html>

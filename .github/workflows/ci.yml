name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Python ${{ matrix.python }} (ruff, mypy, pytest, coverage)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # CoreELEC's Kodi 21 ships 3.11; newer Kodi builds use newer Pythons.
        python: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: python -m pip install -r requirements-dev.txt
      - name: ruff
        run: ruff check --output-format=github .
      - name: mypy
        run: mypy
      - name: Unit tests
        run: python -m pytest --cov=resources/lib --cov-report=term-missing:skip-covered tests/unit

  web:
    name: Dashboard scripts (ESLint)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4.4.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint

  addon:
    name: Kodi add-on checker
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: "3.11"
      - run: python -m pip install kodi-addon-checker==0.0.36
      - name: Export the add-on without development files
        run: |
          mkdir -p "$RUNNER_TEMP/addons"
          git archive HEAD --prefix=script.tinyppi/ | tar -x -C "$RUNNER_TEMP/addons"
          cd "$RUNNER_TEMP/addons/script.tinyppi"
          rm -rf .github tests tools .gitignore pyproject.toml requirements-dev.txt \
                 package.json package-lock.json eslint.config.mjs
      - name: Check
        working-directory: ${{ runner.temp }}/addons
        run: kodi-addon-checker --branch omega script.tinyppi

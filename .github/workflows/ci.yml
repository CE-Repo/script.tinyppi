name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install "ruff~=0.15.0"
      - run: ruff check .

  addon:
    name: Add-on checks
    runs-on: ubuntu-latest
    steps:
      # Checked out under the add-on id: the checker takes the folder name for
      # it.
      - uses: actions/checkout@v4
        with:
          path: script.tinyppi
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install kodi-addon-checker
      # script.module.sidedata is not in the official repository, so the
      # dependency lookup is skipped; everything else the checker reports as
      # a problem fails the job.
      - name: Kodi add-on checker
        run: kodi-addon-checker --branch piers --skip-dependency-checks script.tinyppi
      - name: Generated dialog skins are up to date
        working-directory: script.tinyppi
        run: |
          python3 tools/gen_dialog_skins.py
          git diff --exit-code -- resources/skins
      - name: String tables
        working-directory: script.tinyppi
        run: python3 tools/check_strings.py

name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Python ${{ matrix.python }} (ruff, mypy, pytest, coverage)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # CoreELEC's Kodi 21 ships 3.11; newer Kodi builds use newer Pythons.
        python: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: python -m pip install -r requirements-dev.txt
      - name: ruff
        run: ruff check --output-format=github .
      - name: mypy
        run: mypy
      - name: Unit tests
        run: python -m pytest --cov=resources/lib --cov-report=term-missing:skip-covered tests/unit

  web:
    name: Dashboard scripts (ESLint, tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test

  browser:
    name: Dashboard in Chromium
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.11"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser

  addon:
    name: Kodi add-on checker
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.11"
      - run: python -m pip install kodi-addon-checker==0.0.36
      - name: Export the add-on without development files
        run: |
          mkdir -p "$RUNNER_TEMP/addons"
          git archive HEAD --prefix=script.tinyppi/ | tar -x -C "$RUNNER_TEMP/addons"
          cd "$RUNNER_TEMP/addons/script.tinyppi"
          rm -rf .github tests tools .gitignore pyproject.toml requirements-dev.txt \
                 package.json package-lock.json eslint.config.mjs
      - name: Check
        working-directory: ${{ runner.temp }}/addons
        run: kodi-addon-checker --branch omega script.tinyppi
